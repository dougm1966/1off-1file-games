<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Last Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#0a0716;--ink:#fff1e8;--muted:#a596c4;--accent:#ffcc33;--f-display:"Teko","Arial Narrow",sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#111;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

</style>
<div class="app">
  <div class="hud"><div class="title">Last Line</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Tap the sky to detonate a counter-missile there</div>
</div>
<script>
(()=>{
const LW=360,LH=600,FONT="'Teko', sans-serif";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}


const GROUND=560;
let cities,bases,enemies,mine,blasts,score,wave,state="menu",best=getBest("ll-best"),spawnLeft,spawnT,interT=0;
function newGame(){score=0;wave=0;cities=[60,105,150,210,255,300].map(x=>({x,alive:true}));nextWave();state="play"}
function nextWave(){wave++;bases=[{x:22,ammo:10},{x:180,ammo:10},{x:338,ammo:10}];enemies=[];mine=[];blasts=[];spawnLeft=8+wave*3;spawnT=1;hud()}
function hud(){stats({Score:score,Best:Math.max(best,score),Wave:wave||1,Cities:cities?cities.filter(c=>c.alive).length:6})}
function targets(){return [...cities.filter(c=>c.alive).map(c=>c.x),...bases.map(b=>b.x)]}
function spawnEnemy(x,y){const t=pick(targets())+rnd(-6,6);x=x??rnd(10,LW-10);y=y??0;const sp=22+wave*5.5;const d=Math.hypot(t-x,GROUND-y);
  enemies.push({sx:x,sy:y,x,y,tx:t,ty:GROUND,vx:(t-x)/d*sp,vy:(GROUND-y)/d*sp,split:wave>=3&&Math.random()<.18&&y===0,splitY:rnd(150,320)})}
pointer({down:l=>{if(state!=="play"||l.y>GROUND-30)return;let b=null,bd=1e9;for(const o of bases)if(o.ammo>0){const d=Math.abs(o.x-l.x);if(d<bd){bd=d;b=o}}
  if(!b)return;b.ammo--;const d=Math.hypot(l.x-b.x,l.y-(GROUND-14));mine.push({sx:b.x,sy:GROUND-14,x:b.x,y:GROUND-14,tx:l.x,ty:l.y,vx:(l.x-b.x)/d*520,vy:(l.y-GROUND+14)/d*520,left:d})}});
function update(dt){
  if(state!=="play")return;
  if(interT>0){interT-=dt;if(interT<=0)nextWave();return}
  spawnT-=dt;if(spawnLeft>0&&spawnT<=0){const n=Math.min(spawnLeft,1+(Math.random()<.3+wave*.05?1:0));for(let i=0;i<n;i++)spawnEnemy();spawnLeft-=n;spawnT=rnd(1.2,2.6)/(1+wave*.12)}
  for(const m of mine){m.x+=m.vx*dt;m.y+=m.vy*dt;m.left-=520*dt;if(m.left<=0){m.done=true;blasts.push({x:m.tx,y:m.ty,t:0,r:0})}}
  mine=mine.filter(m=>!m.done);
  for(const b of blasts){b.t+=dt;b.r=b.t<.55?b.t/.55*36:Math.max(0,36*(1-(b.t-.55)/.6))}
  blasts=blasts.filter(b=>b.t<1.15);
  for(const e of enemies){e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(e.split&&e.y>e.splitY){e.split=false;for(let k=0;k<2;k++)spawnEnemy(e.x,e.y)}
    for(const b of blasts)if(Math.hypot(e.x-b.x,e.y-b.y)<b.r){e.dead=true;score+=25;blasts.push({x:e.x,y:e.y,t:.1,r:5});hud();break}
    if(!e.dead&&e.y>=GROUND-4){e.dead=true;blasts.push({x:e.x,y:GROUND-6,t:0,r:0,enemy:true});
      for(const c of cities)if(c.alive&&Math.abs(c.x-e.x)<16){c.alive=false;burst(c.x,GROUND-8,"#ff6a3d",30,160,1)}
      for(const b of bases)if(Math.abs(b.x-e.x)<16){b.ammo=0;burst(b.x,GROUND-8,"#ffcc33",20,140)}
      hud()}}
  enemies=enemies.filter(e=>!e.dead);
  if(!cities.some(c=>c.alive)){state="over";if(score>best){best=score;setBest("ll-best",best)}setTimeout(()=>card(`<h1>The end</h1><p>Score ${score} · survived to wave ${wave}</p><p class="sub">Best ${best}</p>`,"Defend again",newGame),1200);return}
  if(spawnLeft<=0&&!enemies.length&&!mine.length&&!blasts.length){const ammo=bases.reduce((s,b)=>s+b.ammo,0),cs=cities.filter(c=>c.alive).length;const bonus=ammo*5+cs*100;score+=bonus;hud();
    banner=`Wave ${wave} cleared · bonus ${bonus}`;bannerT=2.2;interT=2.4}
}
let banner="",bannerT=0;
function city(x,alive){if(!alive){ctx.fillStyle="#3a2a3a";ctx.fillRect(x-12,GROUND-4,24,4);return}
  const h=[10,16,8,14,11];h.forEach((hh,i)=>{ctx.fillStyle=i%2?"#5fd0ff":"#3fa7e0";ctx.fillRect(x-12+i*5,GROUND-hh,5,hh);ctx.fillStyle="#fff7c2";if(hh>9)ctx.fillRect(x-11+i*5,GROUND-hh+3,1.5,1.5)})}
function draw(){const g=ctx.createLinearGradient(0,0,0,LH);g.addColorStop(0,"#0a0716");g.addColorStop(.7,"#24123e");g.addColorStop(1,"#4a1f3d");ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
  ctx.fillStyle="rgba(255,255,255,.5)";for(let i=0;i<50;i++)ctx.fillRect((i*71)%LW,(i*37)%300,1,1);
  ctx.fillStyle="#c9852c";ctx.beginPath();ctx.moveTo(0,LH);ctx.lineTo(0,GROUND);for(const b of [22,180,338]){ctx.lineTo(b-24,GROUND);ctx.lineTo(b-12,GROUND-14);ctx.lineTo(b+12,GROUND-14);ctx.lineTo(b+24,GROUND)}ctx.lineTo(LW,GROUND);ctx.lineTo(LW,LH);ctx.fill();
  if(cities)for(const c of cities)city(c.x,c.alive);
  if(bases)for(const b of bases){ctx.fillStyle="#ffcc33";for(let i=0;i<b.ammo;i++){const row=i<4?0:i<7?1:i<9?2:3,col=i<4?i:i<7?i-4:i<9?i-7:0,w=[4,3,2,1][row];ctx.fillRect(b.x-w*3+col*6+1,GROUND+4+row*6,3,5)}}
  ctx.lineWidth=1.5;
  if(enemies)for(const e of enemies){ctx.strokeStyle="rgba(255,90,90,.7)";ctx.beginPath();ctx.moveTo(e.sx,e.sy);ctx.lineTo(e.x,e.y);ctx.stroke();ctx.fillStyle="#fff";ctx.fillRect(e.x-1.5,e.y-1.5,3,3)}
  if(mine)for(const m of mine){ctx.strokeStyle="rgba(120,220,255,.8)";ctx.beginPath();ctx.moveTo(m.sx,m.sy);ctx.lineTo(m.x,m.y);ctx.stroke();ctx.strokeStyle="#fff";ctx.beginPath();ctx.moveTo(m.tx-4,m.ty-4);ctx.lineTo(m.tx+4,m.ty+4);ctx.moveTo(m.tx+4,m.ty-4);ctx.lineTo(m.tx-4,m.ty+4);ctx.stroke()}
  if(blasts)for(const b of blasts){const gr=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,Math.max(1,b.r));gr.addColorStop(0,"#fff");gr.addColorStop(.4,b.enemy?"#ff7a3d":"#ffe066");gr.addColorStop(1,b.enemy?"rgba(255,60,60,.2)":"rgba(255,120,200,.25)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
  drawParts();
  if(bannerT>0)text(banner,LW/2,LH/2-40,26,"#ffcc33");
}
loop(dt=>{update(dt);stepParts(dt);bannerT=Math.max(0,bannerT-dt);draw()});
fit();cities=[60,105,150,210,255,300].map(x=>({x,alive:true}));bases=[{x:22,ammo:10},{x:180,ammo:10},{x:338,ammo:10}];hud();
card(`<h1>Last Line</h1><p>Missiles are falling on your six cities. Tap the sky to burst a counter-missile there. Lead your shots, because blasts take a moment to grow.</p><p class="sub">The nearest base with ammo fires. Leftover ammo and surviving cities pay a bonus.</p>`,"Defend",newGame);

})();
</script>

</body></html>
