<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Last Call</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#1d0f0b;--ink:#fff1e0;--muted:#c9a07e;--accent:#ff9d3d;--f-display:"Shrikhand",Georgia,serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#2a1000;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.card{max-height:calc(100% - 16px);overflow:auto}
.setl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;margin-top:2px}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--muted) 40%,transparent);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:36px;border:0;border-radius:0;background:transparent;color:var(--ink);font:600 13px system-ui,sans-serif;padding:0 4px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#2a1000}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls button{height:38px;border-radius:8px;font:700 15px system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid color-mix(in srgb,var(--muted) 40%,transparent)}
.lvls button[aria-pressed=true]{background:var(--accent);color:#2a1000;border-color:var(--accent)}
.lvls button:disabled{opacity:.45;cursor:default}
.chal{text-align:left;font-size:13px;color:var(--muted)}.chal summary{cursor:pointer;font-weight:700;color:var(--ink)}.chal div{padding:2px 0}.chal .ok{color:var(--accent)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--accent);color:var(--ink);padding:6px 12px;border-radius:999px;font:600 13px system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
</style>
<div class="app">
  <div class="hud"><div class="title">Last Call</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Tap a bar to slide a drink down it · tap coins for tips</div>
</div>
<script>
(()=>{
const LW=360,LH=600,FONT="system-ui, sans-serif";
const TAU=Math.PI*2;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
// ---- menus with settings, level select and challenges (saved per game) ----
let SAVE={settings:{},unlocked:1,done:{},best:{}};const SKEY="save-"+document.title;
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(SKEY)||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}};
function setting(k,d){return SAVE.settings[k]??d}
let CHAL=[];
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";stage.appendChild(t)}t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2200)}
function award(id){if(SAVE.done[id])return;const c=CHAL.find(c=>c.id===id);if(!c)return;SAVE.done[id]=1;persist();toast("Challenge done: "+c.text)}
function unlock(n){if(n>SAVE.unlocked){SAVE.unlocked=n;persist()}}
// cfg: {title, html, settings:[{k,label,opts:[[value,label],...],def}], levels:[names]|null, challenges:[{id,text}], play:"Play"}
function menu(cfg,onStart){CHAL=cfg.challenges||[];const o=document.getElementById("over"),c=document.getElementById("card");let lvl=Math.min(setting("_lvl",1),SAVE.unlocked);
  const draw=()=>{const done=CHAL.filter(x=>SAVE.done[x.id]).length;
    c.innerHTML=`<h1>${cfg.title}</h1>${cfg.html||""}
    ${(cfg.settings||[]).map(s=>`<div class="setl">${s.label}</div><div class="seg">${s.opts.map(([v,l])=>`<button data-k="${s.k}" data-v="${v}" aria-pressed="${String(setting(s.k,s.def))===String(v)}">${l}</button>`).join("")}</div>`).join("")}
    ${cfg.levels?`<div class="setl">Level</div><div class="lvls">${cfg.levels.map((n,i)=>`<button data-lv="${i+1}" ${i+1>SAVE.unlocked?"disabled":""} aria-pressed="${lvl===i+1}" title="${n}">${i+1>SAVE.unlocked?"🔒":i+1}</button>`).join("")}</div><div class="sub">${cfg.levels[lvl-1]}</div>`:""}
    ${CHAL.length?`<details class="chal"><summary>Challenges ${done}/${CHAL.length}</summary>${CHAL.map(x=>`<div class="${SAVE.done[x.id]?"ok":""}">${SAVE.done[x.id]?"✓":"○"} ${x.text}</div>`).join("")}</details>`:""}
    <button id="go">${cfg.play||"Play"}</button>`;
    c.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{SAVE.settings[b.dataset.k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;persist();draw()});
    c.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lvl=+b.dataset.lv;SAVE.settings._lvl=lvl;persist();draw()});
    document.getElementById("go").onclick=()=>{o.hidden=true;onStart(lvl)}};
  draw();o.hidden=false}


const LANES=4,TOP=96,LH2=118,BARL=24,BARR=312,DOOR=BARL;
const LEVELS=Array.from({length:10},(_,i)=>`Round ${i+1} · serve ${8+i*3}`);
let lane=0,patrons,drinks,mugs,tips,score,lives,round,served,quota,spawnT,state="menu",pourT=0,noBreak=true,lostLife=false,tipsGot=0,quick=[];
const THEME={soda:{drink:"#c7642a",foam:"#fff6e6",glass:"rgba(220,240,255,.55)",bar:"#7a3b1c",top:"#a5562b"},coffee:{drink:"#5a3418",foam:"#e9d3b5",glass:"rgba(255,255,255,.9)",bar:"#3b2a20",top:"#6b4c38"}};
const T=()=>THEME[setting("theme","soda")];
const laneY=i=>TOP+i*LH2;
function diff(){return ({relaxed:.8,std:1,rush:1.3})[setting("diff","std")]}
function start(lv){round=lv;score=lv>1?score||0:0;lives=setting("lives",3);startRound()}
function startRound(){patrons=[];drinks=[];mugs=[];tips=[];served=0;quota=8+(round-1)*3;spawnT=1;noBreak=true;lostLife=false;state="play";toast(`Round ${round}`);hud()}
function hud(){stats({Round:round||1,Served:`${served||0}/${quota||8}`,"♥":lives??3,Score:score||0})}
pointer({down:l=>{if(state!=="play")return;for(const t of tips)if(Math.hypot(l.x-t.x,l.y-t.y)<22){t.got=true;score+=150;tipsGot++;SAVE.best.tips=(SAVE.best.tips||0)+1;if(SAVE.best.tips>=10)award("tips");persist();burst(t.x,t.y,"#ffd84a",12,100);hud();return}
  const i=clamp(Math.floor((l.y-TOP-20)/LH2)+1,0,LANES-1);lane=i;pour()}});
addEventListener("keydown",e=>{if(state!=="play")return;if(e.key==="ArrowUp")lane=Math.max(0,lane-1);if(e.key==="ArrowDown")lane=Math.min(LANES-1,lane+1);if(e.key===" ")pour()});
function pour(){if(pourT>0)return;pourT=.22;drinks.push({lane,x:BARR-14,v:-(260+round*8)*diff()})}
function spawn(){const pending=quota-served-patrons.length;if(pending<=0)return;const l=Math.floor(Math.random()*LANES);patrons.push({lane:l,x:DOOR-10,state:"walk",t:0,pause:0,look:Math.random()*6|0,speed:(16+round*1.6)*diff()})}
function loseLife(why){lives--;lostLife=true;toast(why);hud();if(lives<=0){state="over";SAVE.best.score=Math.max(SAVE.best.score||0,score);persist();setTimeout(()=>card(`<h1>Closing time</h1><p>${why}</p><p>Score ${score} · round ${round}</p>`,"Menu",openMenu),700)}
  else{patrons=patrons.filter(p=>p.x<BARR-80);drinks=[];mugs=[]}}
function update(dt){if(state!=="play")return;pourT=Math.max(0,pourT-dt);
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=rnd(1.4,2.8)/(1+round*.08)/diff()}
  for(const p of patrons){if(p.state==="walk"){p.pause-=dt;if(p.pause<=0){p.x+=p.speed*dt;if(Math.random()<dt*.6)p.pause=rnd(.3,.9)}if(p.x>=BARR-20){loseLife("A customer got tired of waiting");return}}
    else if(p.state==="pushed"){p.x-=150*dt;p.t-=dt;if(p.x<DOOR-20){p.state="gone";served++;score+=50;quick.push(performance.now());quick=quick.filter(t=>performance.now()-t<5000);if(quick.length>=4)award("rush");hud()}else if(p.t<=0){p.state="drinking";p.t=rnd(.8,1.6)}}
    else if(p.state==="drinking"){p.t-=dt;if(p.t<=0){p.state="walk";mugs.push({lane:p.lane,x:p.x+14,v:(120+round*6)*diff()});if(Math.random()<.18)tips.push({x:p.x,y:laneY(p.lane)-8,t:5,got:false})}}}
  patrons=patrons.filter(p=>p.state!=="gone");
  for(const d of drinks){d.x+=d.v*dt;const target=patrons.filter(p=>p.lane===d.lane&&p.state==="walk"&&p.x<d.x&&p.x>d.x-18)[0];
    if(target){target.state="pushed";target.t=rnd(.35,.6);d.done=true;score+=25;hud()}else if(d.x<BARL){d.done=true;noBreak=false;burst(BARL,laneY(d.lane)-8,"#bfe6ff",14,120);loseLife("A drink slid off the bar");return}}
  drinks=drinks.filter(d=>!d.done);
  for(const m of mugs){m.x+=m.v*dt;if(m.x>=BARR-12){if(lane===m.lane){m.done=true;score+=15;hud()}else if(m.x>BARR+8){m.done=true;noBreak=false;burst(BARR+8,laneY(m.lane)-8,"#bfe6ff",14,120);loseLife("An empty mug hit the floor");return}}}
  mugs=mugs.filter(m=>!m.done);for(const t of tips)t.t-=dt;tips=tips.filter(t=>!t.got&&t.t>0);
  if(served>=quota&&!patrons.length){score+=200*round;if(noBreak)award("nobreak");if(!lostLife)award("perfect");if(round>=5)award("r5");if(round>=10)award("r10");unlock(round+1);persist();state="won";
    setTimeout(()=>card(`<h1>Round ${round} done</h1><p>Score ${score}</p>`,round<10?"Next round":"Menu",()=>{if(round<10){round++;startRound()}else openMenu()}),500)}}
function patron(p){const y=laneY(p.lane),x=p.x,skin=["#f1c27d","#c68642","#8d5524","#ffdbac","#e0ac69","#a1665e"][p.look],shirt=["#3a86ff","#ff006e","#8338ec","#06d6a0","#ffbe0b","#ef476f"][p.look];
  const bob=p.state==="walk"&&p.pause<=0?Math.sin(performance.now()/90+x)*2:0;ctx.fillStyle=shirt;rr(x-11,y-34+bob,22,26,8);ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.arc(x,y-44+bob,10,0,TAU);ctx.fill();
  ctx.fillStyle="#2a1a10";ctx.beginPath();ctx.arc(x,y-48+bob,10,Math.PI,0);ctx.fill();ctx.fillStyle="#111";ctx.fillRect(x+3,y-46+bob,2,2);if(p.state==="drinking"){glass(x+12,y-36,1)}if(p.state==="walk"&&p.x>BARR-90){ctx.fillStyle="#ff4d4d";ctx.font="900 14px system-ui";ctx.textAlign="center";ctx.fillText("!",x,y-62)}}
function glass(x,y,full){const th=T();ctx.fillStyle=th.glass;rr(x-5,y-10,10,12,2);ctx.fill();if(full){ctx.fillStyle=th.drink;ctx.fillRect(x-4,y-7,8,8);ctx.fillStyle=th.foam;ctx.fillRect(x-5,y-10,10,3)}ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1;ctx.strokeRect(x-5,y-10,10,12)}
function draw(){const th=T();const g=ctx.createLinearGradient(0,0,0,LH);g.addColorStop(0,"#2b140c");g.addColorStop(1,"#120805");ctx.fillStyle=g;ctx.fillRect(0,0,LW,LH);
  ctx.fillStyle="#3a1d10";for(let x=0;x<LW;x+=40)ctx.fillRect(x,0,2,LH);ctx.fillStyle="#ffcf8a";ctx.globalAlpha=.08;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(60+i*80,20,60,0,TAU);ctx.fill()}ctx.globalAlpha=1;
  text(setting("theme","soda")==="soda"?"SODA FOUNTAIN":"THE DAILY GRIND",LW/2,34,16,"#ff9d3d");
  for(let i=0;i<LANES;i++){const y=laneY(i);ctx.fillStyle="#140906";ctx.fillRect(0,y-70,DOOR,70);ctx.fillStyle="#ffcf8a";ctx.globalAlpha=.15;ctx.fillRect(2,y-68,DOOR-4,66);ctx.globalAlpha=1;
    ctx.fillStyle=th.top;ctx.fillRect(BARL,y-6,BARR-BARL,8);ctx.fillStyle=th.bar;ctx.fillRect(BARL,y+2,BARR-BARL,22);ctx.fillStyle="rgba(255,255,255,.15)";ctx.fillRect(BARL,y-6,BARR-BARL,2);
    ctx.fillStyle="#9aa3ad";ctx.fillRect(BARR+6,y-30,10,30);ctx.fillStyle="#cfd6de";ctx.fillRect(BARR+2,y-30,18,6)}
  if(patrons)for(const p of patrons)if(p.state!=="drinking"||true)patron(p);
  if(drinks)for(const d of drinks)glass(d.x,laneY(d.lane)-6,1);if(mugs)for(const m of mugs)glass(m.x,laneY(m.lane)-6,0);
  if(tips)for(const t of tips){ctx.fillStyle="#ffd84a";ctx.beginPath();ctx.arc(t.x,t.y,7,0,TAU);ctx.fill();ctx.fillStyle="#b8860b";ctx.font="800 9px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("$",t.x,t.y+.5)}
  const by=laneY(lane);ctx.fillStyle="#fff";rr(BARR+22,by-36,20,30,6);ctx.fill();ctx.fillStyle="#f1c27d";ctx.beginPath();ctx.arc(BARR+32,by-46,10,0,TAU);ctx.fill();ctx.fillStyle="#d62828";ctx.fillRect(BARR+22,by-56,20,6);ctx.fillStyle="#111";ctx.fillRect(BARR+25,by-48,2,2);
  ctx.strokeStyle="rgba(255,157,61,.5)";ctx.lineWidth=2;ctx.strokeRect(0,by-74,LW,84);drawParts()}
loop(dt=>{update(dt);stepParts(dt);draw()});
function openMenu(){menu({title:"Last Call",html:`<p class="sub">Customers walk up the bars. Slide them a drink before they reach you. Catch the empty mugs they send back. Don't let a drink or a mug fall off the end.</p>`,
  settings:[{k:"diff",label:"Pace",def:"std",opts:[["relaxed","Relaxed"],["std","Standard"],["rush","Rush hour"]]},{k:"lives",label:"Lives",def:3,opts:[[3,"3"],[5,"5"]]},{k:"theme",label:"Shop",def:"soda",opts:[["soda","Soda fountain"],["coffee","Coffee bar"]]}],
  levels:LEVELS,challenges:[{id:"perfect",text:"Finish a round without losing a life"},{id:"nobreak",text:"Finish a round without breaking a glass"},{id:"rush",text:"Send 4 customers out the door within 5 seconds"},{id:"tips",text:"Collect 10 tips in total"},{id:"r5",text:"Clear round 5"},{id:"r10",text:"Clear round 10"}],play:"Open up"},lv=>{score=0;start(lv)})}
fit();openMenu();

})();
</script>

</body></html>
