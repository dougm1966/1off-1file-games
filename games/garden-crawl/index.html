<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Garden Crawl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#120d1f;--ink:#f6f0ff;--muted:#a99bc7;--accent:#9cff57;--f-display:"Fredoka","Arial Rounded MT Bold",sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#111;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

</style>
<div class="app">
  <div class="hud"><div class="title">Garden Crawl</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Slide anywhere to move your sprayer · it fires on its own</div>
</div>
<script>
(()=>{
const LW=360,LH=600,FONT="'Fredoka', sans-serif";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}


const CS=20,GW=18,GH=30,ZONE=GH-7;
let mush,segs,player,shot,spider,score,lives,wave,state="menu",best=getBest("gc-best"),stepT=0,inv=0;
const key=(x,y)=>y*GW+x;
function makeMush(n){mush=new Map();for(let i=0;i<n;i++){const x=Math.random()*GW|0,y=1+(Math.random()*(GH-4)|0);if(y<ZONE||Math.random()<.25)mush.set(key(x,y),{x,y,hp:4})}}
function makeCentipede(len){segs=[];for(let i=0;i<len;i++)segs.push({x:8-i,y:0,dx:1,dy:1,px:8-i,py:0,head:i===0})}
function newGame(){score=0;lives=3;wave=1;makeMush(40);makeCentipede(10);player={x:LW/2,y:LH-30};shot=null;spider=null;state="play";inv=1;hud()}
function hud(){stats({Score:score,Best:Math.max(best,score),Wave:wave||1,"♥":lives??3})}
pointer({move:(l,dx,dy)=>{if(state!=="play")return;player.x=clamp(player.x+dx*1.25,8,LW-8);player.y=clamp(player.y+dy*1.25,ZONE*CS+8,LH-8)}});
function step(){
  for(const s of segs){s.px=s.x;s.py=s.y;const nx=s.x+s.dx;
    if(nx<0||nx>=GW||mush.has(key(nx,s.y))){s.y+=s.dy;s.dx*=-1;if(s.y>=GH-1){s.y=GH-1;s.dy=-1}else if(s.y<=ZONE&&s.dy<0){s.dy=1}}
    else s.x=nx}
}
function update(dt){
  if(state!=="play")return;
  const kx=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0),ky=(keys.ArrowUp?-1:0)+(keys.ArrowDown?1:0);player.x=clamp(player.x+kx*240*dt,8,LW-8);player.y=clamp(player.y+ky*240*dt,ZONE*CS+8,LH-8);
  const rate=10+wave*1.5;stepT+=dt*rate;while(stepT>=1){stepT-=1;step()}
  if(!shot)shot={x:player.x,y:player.y-10};else{shot.y-=900*dt;
    const cx=Math.floor(shot.x/CS),cy=Math.floor(shot.y/CS);const m=mush.get(key(cx,cy));
    if(m){m.hp--;score+=m.hp?0:1;if(!m.hp){mush.delete(key(cx,cy));burst(cx*CS+10,cy*CS+10,"#ff8fd1",8,90)}shot=null;hud()}
    else{const f=stepT;for(let i=0;i<segs.length;i++){const s=segs[i],sx=(s.px+(s.x-s.px)*f)*CS+10,sy=(s.py+(s.y-s.py)*f)*CS+10;if(shot&&Math.abs(sx-shot.x)<10&&Math.abs(sy-shot.y)<11){
      score+=s.head?100:10;burst(sx,sy,"#9cff57",16,150);mush.set(key(s.x,s.y),{x:s.x,y:s.y,hp:4});segs.splice(i,1);if(segs[i])segs[i].head=true;shot=null;hud();break}}}
    if(shot&&spider&&Math.hypot(shot.x-spider.x,shot.y-spider.y)<14){const d=Math.abs(spider.y-player.y);const p=d<40?900:d<80?600:300;score+=p;burst(spider.x,spider.y,"#ffb347",20,160);spider=null;shot=null;hud()}
    if(shot&&shot.y<0)shot=null}
  // heads: segment with nothing directly ahead in train
  segs.forEach((s,i)=>{if(i===0)s.head=true});
  if(!spider&&Math.random()<dt*.18){const l=Math.random()<.5;spider={x:l?-10:LW+10,y:rnd(ZONE*CS,LH-20),vx:l?90:-90,vy:110}}
  if(spider){spider.x+=spider.vx*dt;spider.y+=spider.vy*dt;if(spider.y<ZONE*CS-10||spider.y>LH-10){spider.vy*=-1}if(Math.random()<dt*1.2)spider.vy*=-1;
    const m=mush.get(key(Math.floor(spider.x/CS),Math.floor(spider.y/CS)));if(m&&m.y>=ZONE&&Math.random()<.02)mush.delete(key(m.x,m.y));if(spider.x<-30||spider.x>LW+30)spider=null}
  inv=Math.max(0,inv-dt);
  if(!inv){const f=stepT;const hitSeg=segs.some(s=>Math.hypot((s.px+(s.x-s.px)*f)*CS+10-player.x,(s.py+(s.y-s.py)*f)*CS+10-player.y)<15);const hitSp=spider&&Math.hypot(spider.x-player.x,spider.y-player.y)<18;
    if(hitSeg||hitSp){burst(player.x,player.y,"#ffe066",34,200,1);lives--;hud();inv=2;spider=null;
      if(lives<=0){state="over";if(score>best){best=score;setBest("gc-best",best)}setTimeout(()=>card(`<h1>Overgrown</h1><p>Score ${score} · wave ${wave}</p><p class="sub">Best ${best}</p>`,"Again",newGame),900);return}
      const n=segs.length;makeCentipede(n);for(const m of mush.values())m.hp=4;player={x:LW/2,y:LH-30}}}
  if(!segs.length){wave++;score+=250;hud();makeCentipede(10+Math.min(wave,6));}
}
function draw(){ctx.fillStyle="#140f24";ctx.fillRect(0,0,LW,LH);
  ctx.fillStyle="rgba(156,255,87,.05)";ctx.fillRect(0,ZONE*CS,LW,LH-ZONE*CS);ctx.strokeStyle="rgba(156,255,87,.15)";ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(0,ZONE*CS);ctx.lineTo(LW,ZONE*CS);ctx.stroke();ctx.setLineDash([]);
  if(mush)for(const m of mush.values()){const x=m.x*CS+10,y=m.y*CS+10,h=m.hp/4;ctx.fillStyle="#efe3c8";ctx.fillRect(x-3,y,6,8*h+1);ctx.fillStyle="#e2468c";ctx.beginPath();ctx.ellipse(x,y+1,9,8*h,0,Math.PI,0);ctx.fill();ctx.fillStyle="#ffd6ea";if(h>.5){ctx.beginPath();ctx.arc(x-3,y-3*h,1.6,0,7);ctx.arc(x+4,y-4*h,1.3,0,7);ctx.fill()}}
  if(segs){const f=state==="play"?stepT:0;for(let i=segs.length-1;i>=0;i--){const s=segs[i],x=(s.px+(s.x-s.px)*f)*CS+10,y=(s.py+(s.y-s.py)*f)*CS+10,w=Math.sin(performance.now()/80+i)*2;
    ctx.strokeStyle="#4d8a2a";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-8,y-5+w);ctx.lineTo(x+8,y+5-w);ctx.moveTo(x-8,y+5-w);ctx.lineTo(x+8,y-5+w);ctx.stroke();
    const g=ctx.createRadialGradient(x-3,y-3,1,x,y,9);g.addColorStop(0,s.head?"#ffe066":"#c8ff8a");g.addColorStop(1,s.head?"#ff9f1c":"#5fbf2a");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,8.5,0,7);ctx.fill();
    if(s.head){ctx.fillStyle="#1a1030";ctx.beginPath();ctx.arc(x+s.dx*3,y-2,1.8,0,7);ctx.arc(x+s.dx*3,y+3,1.8,0,7);ctx.fill()}}}
  if(spider){const x=spider.x,y=spider.y;ctx.strokeStyle="#ffb347";ctx.lineWidth=2;for(let i=0;i<4;i++){const a=Math.sin(performance.now()/60+i)*.3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-14,y-6+i*4+a*6);ctx.moveTo(x,y);ctx.lineTo(x+14,y-6+i*4-a*6);ctx.stroke()}ctx.fillStyle="#ff7b1c";ctx.beginPath();ctx.ellipse(x,y,8,6,0,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(x-4,y-2,2,2);ctx.fillRect(x+2,y-2,2,2)}
  if(shot){ctx.fillStyle="#bdf7ff";ctx.fillRect(shot.x-1.5,shot.y-6,3,8)}
  if(player&&state==="play"&&!(inv>0&&Math.floor(inv*10)%2)){const x=player.x,y=player.y;ctx.fillStyle="#7ad7ff";rr(x-7,y-4,14,12,4);ctx.fill();ctx.fillStyle="#bdf7ff";ctx.fillRect(x-2,y-11,4,8);ctx.fillStyle="#1d5c7a";ctx.fillRect(x-4,y,8,3)}
  drawParts()}
loop(dt=>{update(dt);stepParts(dt);draw()});
fit();makeMush(40);makeCentipede(10);hud();
card(`<h1>Garden Crawl</h1><p>A centipede is winding down through the mushroom patch. Shoot every segment. Each hit segment sprouts a new mushroom, and the train splits in two.</p><p class="sub">Slide anywhere to move inside the bottom zone. Spiders score more the closer they are when you hit them.</p>`,"Spray",newGame);

})();
</script>

</body></html>
