<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Oche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#14100c;--ink:#f6efe2;--muted:#b5a68e;--accent:#e2b04a;--f-display:"Alfa Slab One",Georgia,serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#2a1a00;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.card{max-height:calc(100% - 16px);overflow:auto}
.setl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;margin-top:2px}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--muted) 40%,transparent);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:36px;border:0;border-radius:0;background:transparent;color:var(--ink);font:600 13px system-ui,sans-serif;padding:0 4px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#2a1a00}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls button{height:38px;border-radius:8px;font:700 15px system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid color-mix(in srgb,var(--muted) 40%,transparent)}
.lvls button[aria-pressed=true]{background:var(--accent);color:#2a1a00;border-color:var(--accent)}
.lvls button:disabled{opacity:.45;cursor:default}
.chal{text-align:left;font-size:13px;color:var(--muted)}.chal summary{cursor:pointer;font-weight:700;color:var(--ink)}.chal div{padding:2px 0}.chal .ok{color:var(--accent)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--accent);color:var(--ink);padding:6px 12px;border-radius:999px;font:600 13px system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
</style>
<div class="app">
  <div class="hud"><div class="title">Oche</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Hold to aim · your hand drifts · release to throw</div>
</div>
<script>
(()=>{
const LW=360,LH=620,FONT="system-ui, sans-serif";
const TAU=Math.PI*2;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
// ---- menus with settings, level select and challenges (saved per game) ----
let SAVE={settings:{},unlocked:1,done:{},best:{}};const SKEY="save-"+document.title;
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(SKEY)||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}};
function setting(k,d){return SAVE.settings[k]??d}
let CHAL=[];
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";stage.appendChild(t)}t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2200)}
function award(id){if(SAVE.done[id])return;const c=CHAL.find(c=>c.id===id);if(!c)return;SAVE.done[id]=1;persist();toast("Challenge done: "+c.text)}
function unlock(n){if(n>SAVE.unlocked){SAVE.unlocked=n;persist()}}
// cfg: {title, html, settings:[{k,label,opts:[[value,label],...],def}], levels:[names]|null, challenges:[{id,text}], play:"Play"}
function menu(cfg,onStart){CHAL=cfg.challenges||[];const o=document.getElementById("over"),c=document.getElementById("card");let lvl=Math.min(setting("_lvl",1),SAVE.unlocked);
  const draw=()=>{const done=CHAL.filter(x=>SAVE.done[x.id]).length;
    c.innerHTML=`<h1>${cfg.title}</h1>${cfg.html||""}
    ${(cfg.settings||[]).map(s=>`<div class="setl">${s.label}</div><div class="seg">${s.opts.map(([v,l])=>`<button data-k="${s.k}" data-v="${v}" aria-pressed="${String(setting(s.k,s.def))===String(v)}">${l}</button>`).join("")}</div>`).join("")}
    ${cfg.levels?`<div class="setl">Level</div><div class="lvls">${cfg.levels.map((n,i)=>`<button data-lv="${i+1}" ${i+1>SAVE.unlocked?"disabled":""} aria-pressed="${lvl===i+1}" title="${n}">${i+1>SAVE.unlocked?"🔒":i+1}</button>`).join("")}</div><div class="sub">${cfg.levels[lvl-1]}</div>`:""}
    ${CHAL.length?`<details class="chal"><summary>Challenges ${done}/${CHAL.length}</summary>${CHAL.map(x=>`<div class="${SAVE.done[x.id]?"ok":""}">${SAVE.done[x.id]?"✓":"○"} ${x.text}</div>`).join("")}</details>`:""}
    <button id="go">${cfg.play||"Play"}</button>`;
    c.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{SAVE.settings[b.dataset.k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;persist();draw()});
    c.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lvl=+b.dataset.lv;SAVE.settings._lvl=lvl;persist();draw()});
    document.getElementById("go").onclick=()=>{o.hidden=true;onStart(lvl)}};
  draw();o.hidden=false}


const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const BX=180,BY=212,BR=150,K=BR/170; // board radius in px per mm
let players,cur=0,dart=0,turnDarts=[],thrown=[],state="menu",aim=null,t=0,msgT=0,msg="",turnStart=0,cricket,atc,dartsUsed=[0,0],cpuBusy=false;
const MODE=()=>setting("mode","501");
function vsCPU(){return setting("opp","2p")==="cpu"}
function names(){return setting("opp","2p")==="solo"?["You"]:vsCPU()?["You","CPU"]:["Player 1","Player 2"]}
function newGame(){const n=names();players=n.map(nm=>({name:nm,score:+setting("start",501),marks:{15:0,16:0,17:0,18:0,19:0,20:0,25:0},pts:0,next:1,darts:0}));cur=0;dart=0;turnDarts=[];thrown=[];state="play";turnStart=players[0].score;hud()}
function hud(){stats(Object.fromEntries(players.map(p=>[p.name,MODE()==="501"?p.score:MODE()==="cricket"?p.pts:(p.next>20?"Bull":p.next)])))}
function scoreAt(x,y){const dx=x-BX,dy=y-BY,r=Math.hypot(dx,dy)/K;if(r>170)return {v:0,m:0,n:0,label:"Miss"};if(r<6.35)return {v:50,m:2,n:25,label:"Bull"};if(r<15.9)return {v:25,m:1,n:25,label:"25"};
  let a=Math.atan2(dx,-dy)*180/Math.PI;a=(a+360+9)%360;const n=ORDER[Math.floor(a/18)];const m=r>=99&&r<107?3:r>=162?2:1;return {v:n*m,m,n,label:(m===3?"T":m===2?"D":"")+n}}
function wobble(){return ({steady:5,std:10,shaky:17})[setting("wob","std")]}
pointer({down:l=>{if(state!=="play"||cpuTurn())return;aim={x:l.x,y:l.y-40,t0:performance.now()}},move:l=>{if(aim){aim.x=l.x;aim.y=l.y-40}},up:()=>{if(!aim)return;const p=drift(aim);aim=null;throwAt(p.x,p.y)}});
function drift(a){const tt=(performance.now()-a.t0)/1000,w=wobble();return {x:a.x+Math.sin(tt*2.3)*w+Math.sin(tt*5.1)*w*.4,y:a.y+Math.cos(tt*1.7)*w+Math.sin(tt*4.3)*w*.35}}
function throwAt(x,y){const sc=wobble()*.35;x+=rnd(-sc,sc);y+=rnd(-sc,sc);const s=scoreAt(x,y);thrown.push({x,y,p:cur});turnDarts.push(s);players[cur].darts++;dart++;apply(s);if(state!=="play")return;if(dart>=3||state==="nextturn")endTurn();else if(cpuTurn())setTimeout(cpuThrow,650);}
function say(m){msg=m;msgT=1.6}
function apply(s){const p=players[cur],mode=MODE();
  if(s.v===50)award("bull");
  if(mode==="501"){const dbl=setting("dout","on")==="on",ns=p.score-s.v;if(ns<0||(dbl&&ns===1)||(ns===0&&dbl&&s.m!==2&&s.v!==50)){say("Bust!");p.score=turnStart;state="nextturn";return}
    p.score=ns;if(ns===0){if(turnStart>=100)award("ton");if(dbl)award("checkout");win(cur);return}}
  if(mode==="cricket"&&s.n>=15){const o=players.filter(q=>q!==p),mk=p.marks[s.n];let add=s.m;const need=Math.max(0,3-mk);const close=Math.min(add,need);p.marks[s.n]+=close;add-=close;if(add>0&&o.some(q=>q.marks[s.n]<3))p.pts+=add*s.n;
    const allClosed=Object.values(p.marks).every(v=>v>=3);if(allClosed&&o.every(q=>p.pts>=q.pts)){award("cricket");win(cur);return}}
  if(mode==="atc"){const target=p.next>20?25:p.next;if(s.n===target||(target===25&&s.n===25)){p.next+=setting("skip","off")==="on"&&target!==25?s.m:1;if(p.next>21||(target===25)){if(p.darts<=45)award("atc45");win(cur);return}}}
  hud()}
function endTurn(){const tot=turnDarts.reduce((a,s)=>a+s.v,0);if(MODE()==="501"&&tot===180&&state!=="nextturn")award("180");say(state==="nextturn"?"Bust!":`${turnDarts.map(s=>s.label).join("  ")}${MODE()==="501"?"  = "+tot:""}`);
  state="wait";setTimeout(()=>{thrown=thrown.filter(d=>false);turnDarts=[];dart=0;cur=(cur+1)%players.length;turnStart=players[cur].score;state="play";hud();if(cpuTurn())setTimeout(cpuThrow,700)},1300)}
function win(i){state="over";hud();const p=players[i];setTimeout(()=>card(`<h1>${p.name} win${p.name==="You"?"":"s"}!</h1><p>${p.darts} darts thrown</p>`,"Rematch",newGame),900)}
function cpuTurn(){return vsCPU()&&cur===1&&state==="play"}
function targetPoint(n,m){if(n===25)return {x:BX,y:BY};const i=ORDER.indexOf(n),a=(i*18)*Math.PI/180,r=(m===3?103:m===2?166:135)*K;return {x:BX+Math.sin(a)*r,y:BY-Math.cos(a)*r}}
function cpuThrow(){if(!cpuTurn())return;const p=players[1],mode=MODE();let tp;
  if(mode==="501"){const s=p.score;if(s<=40&&s%2===0)tp=targetPoint(s/2,2);else if(s===50)tp=targetPoint(25,2);else if(s<=60&&s>40)tp=targetPoint(s-40>20?20:s-40,1);else tp=targetPoint(20,3)}
  else if(mode==="cricket"){const open=[20,19,18,17,16,15,25].find(n=>p.marks[n]<3)||20;tp=targetPoint(open,open===25?2:3)}else{tp=targetPoint(p.next>20?25:p.next,1)}
  const err=({steady:10,std:16,shaky:24})[setting("wob","std")];throwAt(tp.x+rnd(-err,err),tp.y+rnd(-err,err))}
function board(){ctx.fillStyle="#1b1b1b";ctx.beginPath();ctx.arc(BX,BY,BR+18,0,TAU);ctx.fill();
  for(let i=0;i<20;i++){const a0=(i*18-9-90)*Math.PI/180,a1=a0+18*Math.PI/180,dark=i%2===0;
    const ring=(r0,r1,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(BX,BY,r1*K,a0,a1);ctx.arc(BX,BY,r0*K,a1,a0,true);ctx.closePath();ctx.fill()};
    ring(15.9,99,dark?"#151515":"#efe4c8");ring(99,107,dark?"#c8302c":"#1f8a4c");ring(107,162,dark?"#151515":"#efe4c8");ring(162,170,dark?"#c8302c":"#1f8a4c")}
  ctx.fillStyle="#1f8a4c";ctx.beginPath();ctx.arc(BX,BY,15.9*K,0,TAU);ctx.fill();ctx.fillStyle="#c8302c";ctx.beginPath();ctx.arc(BX,BY,6.35*K,0,TAU);ctx.fill();
  ctx.strokeStyle="#b9b9b9";ctx.lineWidth=.8;for(let i=0;i<20;i++){const a=(i*18-9-90)*Math.PI/180;ctx.beginPath();ctx.moveTo(BX+Math.cos(a)*15.9*K,BY+Math.sin(a)*15.9*K);ctx.lineTo(BX+Math.cos(a)*170*K,BY+Math.sin(a)*170*K);ctx.stroke()}
  for(const r of [15.9,99,107,162,170]){ctx.beginPath();ctx.arc(BX,BY,r*K,0,TAU);ctx.stroke()}
  ctx.font="700 13px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#f6efe2";ORDER.forEach((n,i)=>{const a=(i*18-90)*Math.PI/180;ctx.fillText(n,BX+Math.cos(a)*(BR+10),BY+Math.sin(a)*(BR+10))})}
function dartIcon(x,y,p){ctx.fillStyle=p===0?"#36d1ff":"#ff6b9a";ctx.beginPath();ctx.arc(x,y,3.2,0,TAU);ctx.fill();ctx.strokeStyle="#111";ctx.lineWidth=1;ctx.stroke();ctx.strokeStyle=p===0?"#36d1ff":"#ff6b9a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+8,y+12);ctx.stroke()}
function scoreboard(){const y0=400;ctx.fillStyle="#211a12";rr(8,y0,LW-16,LH-y0-8,12);ctx.fill();if(!players)return;const mode=MODE(),w=(LW-16)/players.length;
  players.forEach((p,i)=>{const x=8+i*w;if(i===cur&&state!=="over"){ctx.fillStyle="rgba(226,176,74,.15)";rr(x+4,y0+4,w-8,LH-y0-16,10);ctx.fill()}
    text(p.name,x+w/2,y0+20,15,i===cur?"#e2b04a":"#b5a68e");
    if(mode==="501")text(p.score,x+w/2,y0+62,46,"#f6efe2");
    if(mode==="atc")text(p.next>20?"Bull":String(p.next),x+w/2,y0+62,40,"#f6efe2");
    if(mode==="cricket"){[20,19,18,17,16,15,25].forEach((n,k)=>{const yy=y0+44+k*22,mk=p.marks[n];ctx.fillStyle="#b5a68e";ctx.font="700 13px system-ui";ctx.textAlign="right";ctx.fillText(n===25?"B":n,x+w/2-14,yy);
      ctx.strokeStyle=mk>=3?"#7ee787":"#f6efe2";ctx.lineWidth=2;const cx=x+w/2+6;if(mk>=1){ctx.beginPath();ctx.moveTo(cx-6,yy-6);ctx.lineTo(cx+6,yy+6);ctx.stroke()}if(mk>=2){ctx.beginPath();ctx.moveTo(cx+6,yy-6);ctx.lineTo(cx-6,yy+6);ctx.stroke()}if(mk>=3){ctx.beginPath();ctx.arc(cx,yy,8,0,TAU);ctx.stroke()}});text(p.pts+" pts",x+w/2,LH-26,16,"#f6efe2")}
    if(mode!=="cricket")text(`${p.darts} darts`,x+w/2,y0+100,12,"#b5a68e")});
  if(mode==="501"){const s=players[cur].score;const hint=s<=40&&s%2===0&&setting("dout","on")==="on"?`Out: D${s/2}`:s===50?"Out: Bull":"";if(hint)text(hint,LW/2,LH-60,15,"#7ee787")}
  for(let i=0;i<3;i++){ctx.fillStyle=i<3-dart?"#e2b04a":"#3a2f22";ctx.beginPath();ctx.arc(LW/2-14+i*14,y0+150,4,0,TAU);ctx.fill()}}
function draw(){ctx.fillStyle="#14100c";ctx.fillRect(0,0,LW,LH);const g=ctx.createRadialGradient(BX,BY,BR,BX,BY,BR*2);g.addColorStop(0,"#3a2a1a");g.addColorStop(1,"#14100c");ctx.fillStyle=g;ctx.fillRect(0,0,LW,400);
  board();for(const d of thrown)dartIcon(d.x,d.y,d.p);
  if(aim){const p=drift(aim);ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,7,0,TAU);ctx.moveTo(p.x-12,p.y);ctx.lineTo(p.x+12,p.y);ctx.moveTo(p.x,p.y-12);ctx.lineTo(p.x,p.y+12);ctx.stroke();const s=scoreAt(p.x,p.y);text(s.label,p.x,p.y-20,14,"#fff")}
  scoreboard();if(msgT>0)text(msg,LW/2,385,18,"#e2b04a")}
loop(dt=>{t+=dt;msgT=Math.max(0,msgT-dt);draw()});
