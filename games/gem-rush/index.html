<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Gem Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#170d2b;--ink:#f7f0ff;--muted:#b3a1d8;--accent:#ff7ad9;--f-display:"Baloo 2",sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#2a0a22;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.card{max-height:calc(100% - 16px);overflow:auto}
.setl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;margin-top:2px}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--muted) 40%,transparent);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:36px;border:0;border-radius:0;background:transparent;color:var(--ink);font:600 13px system-ui,sans-serif;padding:0 4px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#2a0a22}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls button{height:38px;border-radius:8px;font:700 15px system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid color-mix(in srgb,var(--muted) 40%,transparent)}
.lvls button[aria-pressed=true]{background:var(--accent);color:#2a0a22;border-color:var(--accent)}
.lvls button:disabled{opacity:.45;cursor:default}
.chal{text-align:left;font-size:13px;color:var(--muted)}.chal summary{cursor:pointer;font-weight:700;color:var(--ink)}.chal div{padding:2px 0}.chal .ok{color:var(--accent)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--accent);color:var(--ink);padding:6px 12px;border-radius:999px;font:600 13px system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
</style>
<div class="app">
  <div class="hud"><div class="title">Gem Rush</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Swipe a gem into a neighbor to swap · match 3 or more</div>
</div>
<script>
(()=>{
const LW=360,LH=560,FONT="'Baloo 2', system-ui, sans-serif";
const TAU=Math.PI*2;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
// ---- menus with settings, level select and challenges (saved per game) ----
let SAVE={settings:{},unlocked:1,done:{},best:{}};const SKEY="save-"+document.title;
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(SKEY)||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}};
function setting(k,d){return SAVE.settings[k]??d}
let CHAL=[];
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";stage.appendChild(t)}t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2200)}
function award(id){if(SAVE.done[id])return;const c=CHAL.find(c=>c.id===id);if(!c)return;SAVE.done[id]=1;persist();toast("Challenge done: "+c.text)}
function unlock(n){if(n>SAVE.unlocked){SAVE.unlocked=n;persist()}}
// cfg: {title, html, settings:[{k,label,opts:[[value,label],...],def}], levels:[names]|null, challenges:[{id,text}], play:"Play"}
function menu(cfg,onStart){CHAL=cfg.challenges||[];const o=document.getElementById("over"),c=document.getElementById("card");let lvl=Math.min(setting("_lvl",1),SAVE.unlocked);
  const draw=()=>{const done=CHAL.filter(x=>SAVE.done[x.id]).length;
    c.innerHTML=`<h1>${cfg.title}</h1>${cfg.html||""}
    ${(cfg.settings||[]).map(s=>`<div class="setl">${s.label}</div><div class="seg">${s.opts.map(([v,l])=>`<button data-k="${s.k}" data-v="${v}" aria-pressed="${String(setting(s.k,s.def))===String(v)}">${l}</button>`).join("")}</div>`).join("")}
    ${cfg.levels?`<div class="setl">Level</div><div class="lvls">${cfg.levels.map((n,i)=>`<button data-lv="${i+1}" ${i+1>SAVE.unlocked?"disabled":""} aria-pressed="${lvl===i+1}" title="${n}">${i+1>SAVE.unlocked?"🔒":i+1}</button>`).join("")}</div><div class="sub">${cfg.levels[lvl-1]}</div>`:""}
    ${CHAL.length?`<details class="chal"><summary>Challenges ${done}/${CHAL.length}</summary>${CHAL.map(x=>`<div class="${SAVE.done[x.id]?"ok":""}">${SAVE.done[x.id]?"✓":"○"} ${x.text}</div>`).join("")}</details>`:""}
    <button id="go">${cfg.play||"Play"}</button>`;
    c.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{SAVE.settings[b.dataset.k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;persist();draw()});
    c.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lvl=+b.dataset.lv;SAVE.settings._lvl=lvl;persist();draw()});
    document.getElementById("go").onclick=()=>{o.hidden=true;onStart(lvl)}};
  draw();o.hidden=false}


const N=8,CS=42,GX=(LW-CS*N)/2,GY=92;
const GC=["#ff4f6d","#ffb23f","#ffe14f","#4fe38a","#3fb7ff","#a97bff","#ff7ad9"];
const LEVELS=Array.from({length:15},(_,i)=>{const l=i+1;return l%3===0?`Collect ${12+l*2} ${["red","orange","yellow","green","blue","purple"][l%6]}`:`Score ${1500+l*900}`});
let B,state="menu",lvl=1,score=0,movesLeft=0,goal,busy=false,idle=0,hintPair=null,combo=0,maxCombo=0,collected=0,madeRainbow=false;
const K=()=>+setting("colors",6);
function goalFor(l){return l%3===0?{type:"collect",color:l%6,n:12+l*2}:{type:"score",n:1500+l*900}}
function rndGem(){return {t:Math.floor(Math.random()*K()),sp:null,fy:0,pop:0}}
function newBoard(){B=[];for(let y=0;y<N;y++){B.push([]);for(let x=0;x<N;x++){let g;do{g=rndGem()}while((x>=2&&B[y][x-1].t===g.t&&B[y][x-2].t===g.t)||(y>=2&&B[y-1][x].t===g.t&&B[y-2][x].t===g.t));B[y].push(g)}}if(!findSwap())newBoard()}
function start(l){lvl=l;goal=goalFor(l);score=0;collected=0;movesLeft=Math.max(14,26-Math.floor(l/2))+({relaxed:6,std:0,tight:-4})[setting("moves","std")];combo=0;maxCombo=0;madeRainbow=false;newBoard();busy=false;state="play";hud()}
function hud(){stats({Lvl:lvl,Moves:movesLeft,[goal.type==="score"?"Score":"Got"]:goal.type==="score"?`${score}/${goal.n}`:`${collected}/${goal.n}`})}
function runs(){const H=[],V=[];for(let y=0;y<N;y++){let x=0;while(x<N){let e=x;const t=B[y][x].t;while(e+1<N&&t>=0&&B[y][e+1].t===t)e++;if(t>=0&&e-x>=2)H.push({cells:[...Array(e-x+1)].map((_,k)=>[x+k,y]),dir:"h"});x=e+1}}
  for(let x=0;x<N;x++){let y=0;while(y<N){let e=y;const t=B[y][x].t;while(e+1<N&&t>=0&&B[e+1][x].t===t)e++;if(t>=0&&e-y>=2)V.push({cells:[...Array(e-y+1)].map((_,k)=>[x,y+k]),dir:"v"});y=e+1}}return [...H,...V]}
function findSwap(){for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(const [dx,dy] of [[1,0],[0,1]]){const x2=x+dx,y2=y+dy;if(x2>=N||y2>=N)continue;if(B[y][x].sp==="rainbow"||B[y2][x2].sp==="rainbow")return [[x,y],[x2,y2]];swap(x,y,x2,y2);const ok=runs().length>0;swap(x,y,x2,y2);if(ok)return [[x,y],[x2,y2]]}return null}
function swap(x1,y1,x2,y2){const a=B[y1][x1];B[y1][x1]=B[y2][x2];B[y2][x2]=a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms*({fast:.6,std:1,slow:1.5})[setting("anim","std")]));
async function trySwap(x1,y1,x2,y2){if(busy||state!=="play")return;if(x2<0||y2<0||x2>=N||y2>=N)return;busy=true;idle=0;hintPair=null;
  const a=B[y1][x1],b=B[y2][x2];swap(x1,y1,x2,y2);await sleep(120);
  if(a.sp==="rainbow"||b.sp==="rainbow"){const other=a.sp==="rainbow"?b:a,rb=a.sp==="rainbow"?[x2,y2]:[x1,y1];const kill=new Set([rb.join()]);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(B[y][x].t===other.t&&other.t>=0)kill.add(x+","+y);movesLeft--;combo=0;await clear(kill,null);await settle();busy=false;endCheck();return}
  if(!runs().length){swap(x1,y1,x2,y2);await sleep(120);busy=false;return}
  movesLeft--;combo=0;await resolve([[x1,y1],[x2,y2]]);busy=false;endCheck()}
async function resolve(swapped){let first=true;while(true){const R=runs();if(!R.length)break;combo++;maxCombo=Math.max(maxCombo,combo);if(combo>=5)award("cascade");
    const kill=new Set(),make=[];const count={};for(const r of R)for(const c of r.cells)count[c.join()]=(count[c.join()]||0)+1;
    for(const r of R){for(const c of r.cells)kill.add(c.join());const piv=(first&&swapped&&r.cells.find(c=>swapped.some(s=>s[0]===c[0]&&s[1]===c[1])))||r.cells[Math.floor(r.cells.length/2)];
      if(r.cells.length>=5)make.push({at:piv,sp:"rainbow",t:-1});else if(r.cells.length===4)make.push({at:piv,sp:r.dir==="h"?"row":"col",t:B[piv[1]][piv[0]].t})}
    for(const k in count)if(count[k]>1&&!make.some(m=>m.at.join()===k)){const [x,y]=k.split(",").map(Number);make.push({at:[x,y],sp:"bomb",t:B[y][x].t})}
    await clear(kill,make);await settle();first=false}}
async function clear(kill,make){const q=[...kill];const seen=new Set(q);
  for(let i=0;i<q.length;i++){const [x,y]=q[i].split(",").map(Number),g=B[y][x];if(!g||!g.sp||make&&make.some(m=>m.at[0]===x&&m.at[1]===y))continue;const add=[];
    if(g.sp==="row")for(let k=0;k<N;k++)add.push([k,y]);if(g.sp==="col")for(let k=0;k<N;k++)add.push([x,k]);if(g.sp==="bomb")for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(x+dx>=0&&y+dy>=0&&x+dx<N&&y+dy<N)add.push([x+dx,y+dy]);
    for(const c of add){const k=c.join();if(!seen.has(k)){seen.add(k);q.push(k)}}}
  for(const k of seen){const [x,y]=k.split(",").map(Number);B[y][x].pop=1}await sleep(170);
  let n=0;for(const k of seen){const [x,y]=k.split(",").map(Number),g=B[y][x];if(goal.type==="collect"&&g.t===goal.color)collected++;burst(GX+x*CS+CS/2,GY+y*CS+CS/2,g.t>=0?GC[g.t]:"#fff",6,120,.5);B[y][x]=null;n++}
  score+=n*20*combo+(n>3?(n-3)*40:0);
  if(make)for(const m of make){const [x,y]=m.at;B[y][x]={t:m.t,sp:m.sp,fy:0,pop:0};if(m.sp==="rainbow"){madeRainbow=true;award("rainbow")}if(m.sp==="bomb")award("bomb")}hud()}
async function settle(){for(let x=0;x<N;x++){let w=N-1;for(let y=N-1;y>=0;y--)if(B[y][x]){if(w!==y){B[w][x]=B[y][x];B[w][x].fy=(w-y);B[y][x]=null}w--}
  for(let y=w;y>=0;y--){const g=rndGem();g.fy=w+1;B[y][x]=g}}await sleep(220)}
function endCheck(){const met=goal.type==="score"?score>=goal.n:collected>=goal.n;
  if(met){state="won";unlock(lvl+1);if(movesLeft>=5)award("spare");if(lvl>=15)award("all");persist();setTimeout(()=>card(`<h1>Level ${lvl} clear</h1><p>${movesLeft} moves to spare · best chain ×${maxCombo}</p>`,lvl<15?"Next level":"Menu",()=>lvl<15?start(lvl+1):openMenu()),400);return}
  if(movesLeft<=0){state="lost";setTimeout(()=>card(`<h1>Out of moves</h1><p>${goal.type==="score"?`${score} of ${goal.n} points`:`${collected} of ${goal.n} collected`}</p>`,"Retry",()=>start(lvl)),400);return}
  if(!findSwap()){toast("No moves · shuffling");newBoard()}}
pointer({down:(l,p)=>{p.cell=[Math.floor((l.x-GX)/CS),Math.floor((l.y-GY)/CS)]},move:(l,dx,dy,p)=>{if(!p.cell||p.used)return;const ax=l.x-p.x0,ay=l.y-p.y0;if(Math.hypot(ax,ay)<CS*.35)return;p.used=true;const [x,y]=p.cell;if(x<0||y<0||x>=N||y>=N)return;
  Math.abs(ax)>Math.abs(ay)?trySwap(x,y,x+Math.sign(ax),y):trySwap(x,y,x,y+Math.sign(ay))}});
function gem(cx,cy,g,s){const r=CS*.38*s;if(g.sp==="rainbow"){for(let i=0;i<6;i++){ctx.fillStyle=GC[i];ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,i*TAU/6,(i+1)*TAU/6);ctx.fill()}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,r*.35,0,TAU);ctx.fill();return}
  const c=GC[g.t];ctx.fillStyle=c;ctx.beginPath();const sides=[0,4,3,6,5,8,40][g.t];if(g.t===0||sides===40){ctx.arc(cx,cy,r,0,TAU)}else for(let i=0;i<sides;i++){const a=i/sides*TAU-Math.PI/2+(sides===4?Math.PI/4:0);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.45)";ctx.beginPath();ctx.ellipse(cx-r*.3,cy-r*.35,r*.3,r*.16,-.5,0,TAU);ctx.fill();ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=1.5;ctx.stroke();
  if(g.sp==="row"||g.sp==="col"){ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.beginPath();for(let k=-1;k<=1;k++){if(g.sp==="row"){ctx.moveTo(cx-r*.7,cy+k*r*.35);ctx.lineTo(cx+r*.7,cy+k*r*.35)}else{ctx.moveTo(cx+k*r*.35,cy-r*.7);ctx.lineTo(cx+k*r*.35,cy+r*.7)}}ctx.stroke()}
  if(g.sp==="bomb"){ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r*.55,0,TAU);ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,r*.18,0,TAU);ctx.fill()}}
function draw(dt){ctx.fillStyle="#170d2b";ctx.fillRect(0,0,LW,LH);if(!B)return;
  if(goal){text(goal.type==="score"?`Goal: ${goal.n} points`:`Goal: collect ${goal.n}`,LW/2,24,18,"#f7f0ff");if(goal.type==="collect"){gem(LW/2+110,24,{t:goal.color,sp:null},.5)}
    const pr=Math.min(1,goal.type==="score"?score/goal.n:collected/goal.n);ctx.fillStyle="#2b1a4d";rr(30,48,LW-60,10,5);ctx.fill();ctx.fillStyle="#ff7ad9";rr(30,48,(LW-60)*pr,10,5);ctx.fill();text(`${movesLeft} moves`,LW/2,72,14,"#b3a1d8")}
  ctx.fillStyle="#22143d";rr(GX-6,GY-6,CS*N+12,CS*N+12,14);ctx.fill();for(let y=0;y<N;y++)for(let x=0;x<N;x++)if((x+y)%2){ctx.fillStyle="#2a1a4a";ctx.fillRect(GX+x*CS,GY+y*CS,CS,CS)}
  ctx.save();ctx.beginPath();ctx.rect(GX-6,GY-6,CS*N+12,CS*N+12);ctx.clip();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const g=B[y][x];if(!g)continue;g.fy=Math.max(0,g.fy-dt*14);const s=g.pop?Math.max(0,1-(g.pop+=dt*6)*.0+0)*(1-Math.min(1,(g.pop-1)))||0:1;
    let sc=g.pop?Math.max(.05,1.3-g.pop*.4):1;if(hintPair&&hintPair.some(p=>p[0]===x&&p[1]===y))sc*=1+Math.sin(performance.now()/120)*.08;gem(GX+x*CS+CS/2,GY+(y-g.fy)*CS+CS/2,g,sc)}
  ctx.restore();drawParts()}
loop(dt=>{if(state==="play"&&!busy){idle+=dt;if(idle>5&&!hintPair&&setting("hint","on")==="on")hintPair=findSwap()}stepParts(dt);draw(dt)});
function openMenu(){menu({title:"Gem Rush",html:`<p class="sub">Swap neighboring gems to line up three or more. Match 4 for a striped gem that clears a line, an L or T for a bomb, and 5 for a rainbow gem that clears one whole color.</p>`,
  settings:[{k:"colors",label:"Gem colors",def:6,opts:[[5,"5 · easier"],[6,"6"],[7,"7 · harder"]]},{k:"moves",label:"Moves",def:"std",opts:[["relaxed","+6"],["std","Standard"],["tight","−4"]]},{k:"hint",label:"Hints when idle",def:"on",opts:[["on","On"],["off","Off"]]},{k:"anim",label:"Animation",def:"std",opts:[["fast","Fast"],["std","Normal"],["slow","Slow"]]}],
  levels:LEVELS,challenges:[{id:"bomb",text:"Make a bomb gem"},{id:"rainbow",text:"Make a rainbow gem"},{id:"cascade",text:"Chain a 5× cascade"},{id:"spare",text:"Clear a level with 5+ moves left"},{id:"all",text:"Clear all 15 levels"}],play:"Play"},start)}
fit();openMenu();

})();
