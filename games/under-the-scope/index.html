<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Under the Scope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: eyepiece view with slide label above it, answers below; solo or pass-and-play */
:root{--bg:#0e1114;--panel:#171c21;--line:#2a323a;--ink:#e9eef2;--muted:#94a2ae;--accent:#7cc7e8;--good:#55c98a;--bad:#ef6a5a;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
.app{max-width:520px;margin:0 auto;display:grid;gap:10px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-family:var(--f-head);font-size:24px}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slidebar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:20px}
.slidebar b{color:var(--ink);font-family:var(--f-head);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.timer i{display:block;height:100%;background:var(--accent)}
.scope{display:flex;justify-content:center}
canvas{display:block;width:min(100%,400px);height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 9px #1e252c,0 0 0 11px #39434d,0 16px 40px rgba(0,0,0,.6)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;font:inherit;font-size:15px;line-height:1.25;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-height:56px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.why strong{display:block;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.btn{height:48px;border:0;border-radius:10px;background:var(--accent);color:#06222e;font-family:var(--f-head);font-weight:700;font-size:17px;cursor:pointer;padding:0 18px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.score.on{border-color:var(--accent)}
.score .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:600}
.score .v{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:42px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent);color:#06222e}
.lbl{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:4px;flex:1;min-width:130px}.field span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.field input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:14px;cursor:pointer;background:var(--bg)}
.big{font-family:var(--f-head);font-size:26px;font-weight:700;margin:0;text-align:center}
.muted{color:var(--muted);margin:0;text-align:center}
.note{font-size:13px;color:var(--muted);margin:0}
</style>
<div class="app">
  <header><h1>Under the Scope</h1><span class="tag" id="tag">Identify the field</span></header>
  <div class="scores" id="scores" hidden></div>
  <div class="slidebar" id="slide"></div>
  <div class="timer" id="timer" hidden><i id="tbar"></i></div>
  <div class="scope"><canvas id="cv" width="760" height="760" aria-label="Microscope field"></canvas></div>
  <div id="view"></div>
</div>
<script>
(()=>{
// ================= rendering engine =================
const S=760,R=380,OUT=document.getElementById("cv"),og=OUT.getContext("2d");
const mk=()=>{const c=document.createElement("canvas");c.width=c.height=S;return c};
const MAIN=mk(),SOFT=mk(),NOISE=mk();
let g=MAIN.getContext("2d");
(()=>{const n=NOISE.getContext("2d"),d=n.createImageData(S,S);for(let i=0;i<d.data.length;i+=4){const v=120+Math.random()*135|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)})();
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],TAU=Math.PI*2;
const hex=c=>{const n=parseInt(c.slice(1),16);return [n>>16,n>>8&255,n&255]};
const rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const mix=(a,b,t)=>{a=typeof a==="string"?hex(a):a;b=typeof b==="string"?hex(b):b;return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
const jit=(c,j)=>{const a=typeof c==="string"?hex(c):c;const k=rnd(-j,j);return [a[0]+k,a[1]+k*.8,a[2]+k*.9]};
// Draw fn() blurred (out of focus) onto the current layer.
function soft(px,fn){const prev=g,s=SOFT.getContext("2d");s.clearRect(0,0,S,S);g=s;fn();g=prev;g.save();g.filter=`blur(${px}px)`;g.drawImage(SOFT,0,0);g.restore()}
// Smooth irregular closed outline.
function blobPath(x,y,rx,ry,rot=0,irr=.12,n=10){const pts=[];const ph=rnd(0,TAU);for(let i=0;i<n;i++){const a=i/n*TAU,k=1+Math.sin(a*2+ph)*irr*.5+rnd(-irr,irr)*.5;pts.push([x+Math.cos(a+rot)*rx*k*Math.cos(rot)**0, y+Math.sin(a+rot)*ry*k])}
  g.beginPath();for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],m=[(p[0]+q[0])/2,(p[1]+q[1])/2];if(!i){const l=pts[n-1];g.moveTo((l[0]+p[0])/2,(l[1]+p[1])/2)}g.quadraticCurveTo(p[0],p[1],m[0],m[1])}g.closePath()}
function speckle(n,x,y,r,col,s0,s1,al){for(let i=0;i<n;i++){const a=rnd(0,TAU),d=Math.sqrt(Math.random())*r;g.fillStyle=rgb(col,al*rnd(.5,1));g.beginPath();g.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,rnd(s0,s1),0,TAU);g.fill()}}
function scatter(n,minD,maxR=R*1.02,avoid=[],tries=60){const pts=[];let t=0;while(pts.length<n&&t<n*tries){t++;const a=rnd(0,TAU),d=Math.sqrt(Math.random())*maxR,p={x:R+Math.cos(a)*d,y:R+Math.sin(a)*d};
  if(pts.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>minD)&&avoid.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>q.r+minD*.6))pts.push(p)}return pts}
function wash(base,blots,blotCol,al){g.fillStyle=rgb(hex(base));g.fillRect(0,0,S,S);for(let i=0;i<blots;i++){const x=rnd(0,S),y=rnd(0,S),r=rnd(30,140),gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgb(blotCol,al*rnd(.4,1)));gr.addColorStop(1,rgb(blotCol,0));g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}}
function render(sp){g=MAIN.getContext("2d");g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,S,S);g.filter="none";sp.draw();
  og.save();og.clearRect(0,0,S,S);og.beginPath();og.arc(R,R,R,0,TAU);og.clip();
  og.filter="blur(0.7px)";og.drawImage(MAIN,0,0);og.filter="none";
  og.globalCompositeOperation="overlay";og.globalAlpha=.16;og.drawImage(NOISE,0,0);og.globalAlpha=1;og.globalCompositeOperation="source-over";
  const lx=R+rnd(-60,60),ly=R+rnd(-60,60),ill=og.createRadialGradient(lx,ly,R*.3,R,R,R*1.05);ill.addColorStop(0,"rgba(255,250,235,.06)");ill.addColorStop(.75,"rgba(0,0,0,.08)");ill.addColorStop(.93,"rgba(0,0,0,.35)");ill.addColorStop(1,"rgba(0,0,0,.85)");og.fillStyle=ill;og.fillRect(0,0,S,S);og.restore()}
// ================= blood smear =================
const SMEAR={bg:"#f1e9ec",rbc:"#df9ea6"};
function smearBg(){wash(SMEAR.bg,26,hex("#e3d2db"),.5);for(let i=0;i<6;i++){const x=rnd(0,S),y=rnd(0,S);g.fillStyle="rgba(255,255,255,.18)";g.beginPath();g.arc(x,y,rnd(20,60),0,TAU);g.fill()}}
function rbc(x,y,r,o={}){const col=o.col||jit(SMEAR.rbc,10),pal=o.pallor??rnd(.32,.44);g.save();g.translate(x,y);g.rotate(rnd(0,TAU));
  const rx=r*rnd(.95,1.06),ry=r*rnd(.92,1.02);g.beginPath();g.ellipse(0,0,rx,ry,0,0,TAU);
  const cx=rnd(-2,2),cy=rnd(-2,2),gr=g.createRadialGradient(cx,cy,0,0,0,Math.max(rx,ry));
  if(pal>0){gr.addColorStop(0,rgb(mix(col,"#f7eef2",.62)));gr.addColorStop(pal*.6,rgb(mix(col,"#f7eef2",.55)));gr.addColorStop(Math.min(.9,pal+.16),rgb(col))}else{gr.addColorStop(0,rgb(mix(col,"#ffffff",.05)));gr.addColorStop(.6,rgb(col))}
  gr.addColorStop(.9,rgb(col));gr.addColorStop(1,rgb(mix(col,"#7a3446",.16)));g.fillStyle=gr;g.fill();g.strokeStyle=rgb(mix(col,"#6a2a3a",.35),.35);g.lineWidth=1;g.stroke();g.restore()}
function rbcField(n,avoid=[],r=21){const pts=scatter(n,r*1.72,R*1.05,avoid);for(const p of pts)rbc(p.x,p.y,r*rnd(.92,1.08));return pts}
function platelets(n,avoid=[]){for(const p of scatter(n,40,R,avoid)){const r=rnd(3,5.5);g.fillStyle=rgb(jit("#b8a3cf",8),.85);blobPath(p.x,p.y,r*1.3,r,rnd(0,TAU),.35,7);g.fill();speckle(6,p.x,p.y,r*.7,hex("#5b2e7d"),.6,1.3,.8)}}
function cytoplasm(x,y,r,col,irr=.06){const c=hex(col);blobPath(x,y,r,r*rnd(.94,1),rnd(0,TAU),irr,14);const gr=g.createRadialGradient(x,y,r*.2,x,y,r);gr.addColorStop(0,rgb(mix(c,"#ffffff",.12)));gr.addColorStop(.85,rgb(c));gr.addColorStop(1,rgb(mix(c,"#5a3a5a",.18)));g.fillStyle=gr;g.fill();g.strokeStyle=rgb(mix(c,"#4a2a4a",.3),.4);g.lineWidth=1;g.stroke()}
// Chromatin: fill a nucleus path, then clumped dark + pale spots inside it.
function chromatin(pathFn,base,dark,lite,dens=1){g.save();pathFn();g.fillStyle=rgb(hex(base));g.fill();g.clip();const b=g.getTransform();
  for(let i=0;i<90*dens;i++){g.fillStyle=rgb(hex(dark),rnd(.15,.45));g.beginPath();g.arc(rnd(0,S),rnd(0,S),rnd(1.5,4),0,TAU);g.fill()}
  g.restore();g.save();pathFn();g.clip();const bb=boundsOf(pathFn);for(let i=0;i<160*dens;i++){const x=rnd(bb[0],bb[2]),y=rnd(bb[1],bb[3]);g.fillStyle=Math.random()<.6?rgb(hex(dark),rnd(.2,.5)):rgb(hex(lite),rnd(.15,.35));g.beginPath();g.arc(x,y,rnd(1.2,3.4),0,TAU);g.fill()}
  g.restore();g.save();pathFn();g.strokeStyle=rgb(hex(dark),.55);g.lineWidth=1.2;g.stroke();g.restore()}
let _bb=null;function boundsOf(){return _bb}
function lobed(x,y,n,r,rot,base="#5e3184"){const pts=[];for(let i=0;i<n;i++){const t=n===1?0:i/(n-1)-.5,a=rot+t*(n>4?rnd(3.6,4.4):rnd(2.4,3.2));pts.push([x+Math.cos(a)*r*(n>4?.5:.38)+rnd(-3,3),y+Math.sin(a)*r*(n>4?.5:.38)+rnd(-3,3),rnd(.27,.33)*r*(n>5?.8:1),rnd(.2,.25)*r*(n>5?.85:1),a+Math.PI/2+rnd(-.5,.5)])}
  _bb=[x-r,y-r,x+r,y+r];
  const path=()=>{g.beginPath();for(const p of pts){g.moveTo(p[0]+Math.cos(p[4])*p[2],p[1]+Math.sin(p[4])*p[2]);g.ellipse(p[0],p[1],p[2],p[3],p[4],0,TAU)}for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L*1.3,ny=dx/L*1.3;g.moveTo(a[0]+nx,a[1]+ny);g.lineTo(b[0]+nx,b[1]+ny);g.lineTo(b[0]-nx,b[1]-ny);g.lineTo(a[0]-nx,a[1]-ny);g.closePath()}};
  chromatin(path,base,"#2c0f45","#9a77c0")}
function centerSpot(r){return {x:R+rnd(-80,80),y:R+rnd(-80,80),r}}
function neutrophil(c,lobes){cytoplasm(c.x,c.y,c.r,"#ead6de");speckle(220,c.x,c.y,c.r*.92,hex("#b88aa8"),.6,1.2,.55);lobed(c.x,c.y,lobes,c.r*.95,rnd(0,TAU))}
function sickle(x,y,r){g.save();g.translate(x,y);g.rotate(rnd(0,TAU));const L=r*rnd(1.2,1.5),b=rnd(.25,.45),col=jit("#cc7686",8);g.beginPath();g.moveTo(-L,0);g.bezierCurveTo(-L*.5,-r*1.05,L*.5,-r*1.05,L,0);g.bezierCurveTo(L*.4,-r*b,-L*.4,-r*b,-L,0);g.closePath();
  const gr=g.createLinearGradient(0,-r,0,0);gr.addColorStop(0,rgb(mix(col,"#7a3446",.25)));gr.addColorStop(1,rgb(col));g.fillStyle=gr;g.fill();g.strokeStyle=rgb(mix(col,"#5a2030",.4),.5);g.lineWidth=1;g.stroke();g.restore()}
function target(x,y,r){rbc(x,y,r*1.05,{pallor:.62});const col=jit("#d28795",6);const gr=g.createRadialGradient(x,y,0,x,y,r*.38);gr.addColorStop(0,rgb(col));gr.addColorStop(.8,rgb(col,.9));gr.addColorStop(1,rgb(col,0));g.fillStyle=gr;g.beginPath();g.arc(x+rnd(-1.5,1.5),y+rnd(-1.5,1.5),r*.38,0,TAU);g.fill()}
function sphero(x,y,r){const col=jit("#c86f80",8);const gr=g.createRadialGradient(x-2,y-2,0,x,y,r);gr.addColorStop(0,rgb(mix(col,"#ffffff",.06)));gr.addColorStop(.85,rgb(col));gr.addColorStop(1,rgb(mix(col,"#5a2030",.35)));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function frag(x,y,r){const col=jit("#d0808f",8);g.save();g.translate(x,y);g.rotate(rnd(0,TAU));g.beginPath();const k=Math.random();
  if(k<.45){g.arc(0,0,r,Math.PI*1.05,Math.PI*1.95);g.lineTo(r*.75,r*.05);g.quadraticCurveTo(r*.45,-r*.2,r*.2,r*.15);g.quadraticCurveTo(-r*.2,-r*.15,-r*.75,r*.05);}
  else if(k<.75){g.moveTo(-r*.9,r*.5);g.quadraticCurveTo(0,r*.65,r*.85,r*.45);g.quadraticCurveTo(r*.1,-r*.1,-r*.05,-r*.85);g.quadraticCurveTo(-r*.2,-r*.1,-r*.9,r*.5)}
  else{g.ellipse(0,0,r*.45,r*.32,0,0,TAU)}g.closePath();g.fillStyle=rgb(col);g.fill();g.strokeStyle=rgb(mix(col,"#5a2030",.4),.5);g.lineWidth=1;g.stroke();g.restore()}
function tear(x,y,r){const col=jit("#d68b99",8);g.save();g.translate(x,y);g.rotate(rnd(0,TAU));const t=r*rnd(1.6,2.4);g.beginPath();g.arc(0,0,r,Math.PI*.3,Math.PI*1.7);g.bezierCurveTo(r*.8,-r*.75,r*1.4,-r*.1,t,rnd(-3,3));g.bezierCurveTo(r*1.4,r*.1,r*.8,r*.75,Math.cos(Math.PI*.3)*r,Math.sin(Math.PI*.3)*r);g.closePath();
  const gr=g.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,rgb(mix(col,"#f7eef2",.55)));gr.addColorStop(.6,rgb(col));gr.addColorStop(1,rgb(mix(col,"#7a3446",.25)));g.fillStyle=gr;g.fill();g.strokeStyle=rgb(mix(col,"#5a2030",.4),.45);g.lineWidth=1;g.stroke();g.restore()}
function ring(x,y,r=5.5){g.strokeStyle="rgba(70,90,165,.85)";g.lineWidth=1.6;g.beginPath();g.arc(x,y,r,rnd(0,1),TAU-rnd(.2,.8));g.stroke();g.fillStyle="#8f1846";g.beginPath();g.arc(x+r*.7,y-r*.5,1.9,0,TAU);g.fill();if(Math.random()<.3){g.beginPath();g.arc(x+r*.9,y+r*.1,1.6,0,TAU);g.fill()}}
// ================= gram / AFB =================
function gramBg(){wash("#f2e6ea",40,hex("#e7c3cf"),.55);soft(5,()=>{for(let i=0;i<6;i++)mucus("rgba(214,140,170,.16)")});speckle(200,R,R,R,hex("#c77c98"),.6,1.8,.3)}
function mucus(col){g.strokeStyle=col;g.lineWidth=rnd(8,26);g.lineCap="round";g.beginPath();let x=rnd(0,S),y=rnd(0,S),a=rnd(0,TAU);g.moveTo(x,y);for(let k=0;k<5;k++){a+=rnd(-.8,.8);const nx=x+Math.cos(a)*rnd(60,140),ny=y+Math.sin(a)*rnd(60,140);g.quadraticCurveTo((x+nx)/2+rnd(-30,30),(y+ny)/2+rnd(-30,30),nx,ny);x=nx;y=ny}g.stroke();g.lineCap="butt"}
function pmnGram(x,y,r,nuc="#c4416f",cyto="#f3cfda"){cytoplasm(x,y,r,cyto,.12);const pts=[];for(let i=0;i<rnd(2,4);i++)pts.push([x+rnd(-r*.4,r*.4),y+rnd(-r*.4,r*.4)]);for(const p of pts){g.fillStyle=rgb(jit(nuc,10),.85);blobPath(p[0],p[1],r*.26,r*.2,rnd(0,TAU),.3,8);g.fill()}}
function coccus(x,y,r,col){const c=jit(col,10),gr=g.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);gr.addColorStop(0,rgb(mix(c,"#ffffff",.15)));gr.addColorStop(1,rgb(c));g.fillStyle=gr;g.beginPath();g.ellipse(x,y,r,r*rnd(.88,1),rnd(0,TAU),0,TAU);g.fill()}
function rod(x,y,L,W,a,col,sq=false){const c=jit(col,12);g.save();g.translate(x,y);g.rotate(a);const rr=sq?W*.18:W/2;g.beginPath();g.moveTo(-L/2+rr,-W/2);g.arcTo(L/2,-W/2,L/2,W/2,rr);g.arcTo(L/2,W/2,-L/2,W/2,rr);g.arcTo(-L/2,W/2,-L/2,-W/2,rr);g.arcTo(-L/2,-W/2,L/2,-W/2,rr);g.closePath();
  const gr=g.createLinearGradient(0,-W/2,0,W/2);gr.addColorStop(0,rgb(mix(c,"#ffffff",.12)));gr.addColorStop(1,rgb(c));g.fillStyle=gr;g.fill();g.restore()}
// AFB: slender continuous curved rods with uneven (beaded) staining, not dot chains.
function afbRod(x,y,L,a){const curve=rnd(-.5,.5),segs=12;const P=[];for(let i=0;i<=segs;i++){const t=i/segs-.5;P.push([x+Math.cos(a)*t*L-Math.sin(a)*t*t*curve*L*.6,y+Math.sin(a)*t*L+Math.cos(a)*t*t*curve*L*.6])}
  g.lineCap="round";g.lineJoin="round";g.strokeStyle=rgb(jit("#c41f55",10));g.lineWidth=rnd(2.8,3.4);g.beginPath();P.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();
  for(let i=0;i<segs;i++)if(Math.random()<.45){g.strokeStyle=rgb(hex("#7f0f35"),rnd(.35,.7));g.lineWidth=3.2;g.beginPath();g.moveTo(...P[i]);g.lineTo(...P[i+1]);g.stroke()}else if(Math.random()<.3){g.strokeStyle="rgba(240,150,180,.6)";g.lineWidth=2;g.beginPath();g.moveTo(...P[i]);g.lineTo(...P[i+1]);g.stroke()}g.lineCap="butt"}

  refr(()=>{g.beginPath();g.moveTo(-L,0);g.lineTo(-L*.62,-W);g.lineTo(L*.62,-W);g.lineTo(L,0);g.lineTo(L*.62,W);g.lineTo(-L*.62,W);g.closePath()},hex("#f6f6f0"),.3);

{id:"yeast",grp:"bug",slide:GRAM,name:"Budding yeast with pseudohyphae",info:"Gram-positive ovals, larger than bacteria, some with buds, plus elongated cells in chains with pinched constrictions (pseudohyphae). Typical of Candida. Staining is often patchy.",
 draw(){gramBg();for(const p of scatter(2,200,R*.7))pmnGram(p.x,p.y,rnd(26,32));for(const p of scatter(26,32)){g.save();g.translate(p.x,p.y);g.rotate(rnd(0,TAU));const c=Math.random()<.25?"#7a52a2":"#3e1f72";g.fillStyle=rgb(jit(c,10));g.beginPath();g.ellipse(0,0,rnd(8,9.5),rnd(6,7),0,0,TAU);g.fill();if(Math.random()<.55){g.beginPath();g.ellipse(13,0,5,4.2,0,0,TAU);g.fill()}g.restore()}
   for(let k=0;k<4;k++){let x=rnd(150,610),y=rnd(150,610),a=rnd(0,TAU);for(let s=0;s<rnd(5,8);s++){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=rgb(jit("#45227a",10));g.beginPath();g.ellipse(0,0,16,5.2,0,0,TAU);g.fill();g.restore();x+=Math.cos(a)*30;y+=Math.sin(a)*30;a+=rnd(-.35,.35);if(Math.random()<.25){const b=a+pick([-1,1])*rnd(.6,1);g.save();g.translate(x,y);g.rotate(b);g.fillStyle="#45227a";g.beginPath();g.ellipse(8,0,8,4.6,0,0,TAU);g.fill();g.restore()}}}}},
{id:"afb",grp:"bug",slide:AFBS,name:"Acid-fast bacilli",info:"Slender, slightly curved red rods with uneven, beaded staining, against a blue methylene blue counterstain, sometimes lying in parallel clumps (cording). Mycolic acids hold the carbol fuchsin. Think Mycobacterium.",
 draw(){wash("#bfd0ea",44,hex("#8ea7d6"),.5);soft(5,()=>{for(let i=0;i<6;i++)mucus("rgba(70,100,170,.16)")});speckle(260,R,R,R,hex("#5a77b5"),.8,2.2,.35);for(const p of scatter(4,170,R*.8))pmnGram(p.x,p.y,rnd(26,32),"#4d69b3","#b8c8e8");
   for(const p of scatter(22,26))afbRod(p.x,p.y,rnd(20,30),rnd(0,TAU));
   for(let k=0;k<2;k++){const cx=rnd(200,560),cy=rnd(200,560),a=rnd(0,TAU);for(let i=0;i<rnd(5,8);i++)afbRod(cx+Math.cos(a+Math.PI/2)*i*5+rnd(-4,4)+Math.cos(a)*rnd(-14,14),cy+Math.sin(a+Math.PI/2)*i*5+rnd(-4,4)+Math.sin(a)*rnd(-14,14),rnd(22,30),a+rnd(-.15,.15))}}},
{id:"caox",grp:"urine",slide:URINE,name:"Calcium oxalate dihydrate crystals",info:"Colorless, highly refractile envelope shapes: squares crossed by an X (bipyramids seen end-on), in many sizes. Common in acidic or neutral urine and in calcium oxalate stone formers.",
 draw(){urineBg();soft(2.5,()=>{for(const p of scatter(6,60))caox(p.x,p.y,rnd(6,12))});for(const p of scatter(30,36))caox(p.x,p.y,rnd(4,15));for(const p of scatter(3,60))urineRBC(p.x,p.y)}},
{id:"tp",grp:"urine",slide:URINE,name:"Triple phosphate crystals",info:"Colorless, three-dimensional 'coffin-lid' prisms in alkaline urine, associated with urease-producing bacteria like Proteus.",
 draw(){urineBg();soft(3,()=>{for(const p of scatter(3,100))prism(p.x,p.y,rnd(25,40))});for(const p of scatter(10,90))prism(p.x,p.y,rnd(24,52));for(let i=0;i<120;i++){g.fillStyle="rgba(60,60,50,.45)";g.fillRect(rnd(0,S),rnd(0,S),rnd(2,4),1.5)}}},
{id:"uric",grp:"urine",slide:URINE,name:"Uric acid crystals",info:"Yellow to red-brown rhomboid plates, lemon shapes and rosettes, often layered, in acidic urine. Seen with gout, tumor lysis, and chemotherapy.",
 draw(){urineBg();for(const p of scatter(18,48)){const n=Math.random()<.35?rnd(3,6)|0:Math.random()<.4?2:1;const a0=rnd(0,TAU);for(let k=0;k<n;k++)uric(p.x+rnd(-3,3),p.y+rnd(-3,3),rnd(11,20),a0+k*(Math.PI/n)+rnd(-.1,.1))}}},
{id:"cystine",grp:"urine",slide:URINE,name:"Cystine crystals",info:"Colorless, thin hexagonal plates, often layered or overlapping, in acidic urine. Always abnormal and diagnostic of cystinuria.",
 draw(){urineBg();for(const p of scatter(12,75)){const s=rnd(18,36),a=rnd(0,1),n=Math.random()<.5?rnd(2,4)|0:1;for(let k=0;k<n;k++)hexagon(p.x+k*rnd(5,10),p.y+k*rnd(3,8),s*(1-k*.12),a+k*rnd(.1,.3))}}},
{id:"hyaline",grp:"urine",slide:URINE,name:"Hyaline casts",info:"Pale, nearly transparent cylinders of uromodulin (Tamm-Horsfall protein) with parallel sides and rounded ends. Easy to miss without reduced light. A few can be normal after exercise or dehydration.",
 draw(){urineBg();for(const p of scatter(4,140,R*.75))cast(p.x,p.y,rnd(120,190),rnd(20,26),rnd(0,TAU),"hyaline");soft(2,()=>{const p=scatter(1,0,R*.6)[0];cast(p.x,p.y,150,22,rnd(0,TAU),"hyaline")});for(const p of scatter(3,60))urineWBC(p.x,p.y)}},
{id:"granular",grp:"urine",slide:URINE,name:"Granular casts",info:"Casts filled with fine or coarse granules from degenerating cells or protein aggregates. They point to renal tubular disease, though a few can follow strenuous exercise.",
 draw(){urineBg();for(const p of scatter(4,140,R*.75))cast(p.x,p.y,rnd(110,170),rnd(22,28),rnd(0,TAU),"granular");for(const p of scatter(4,60))urineRBC(p.x,p.y)}},
{id:"squam",grp:"urine",slide:URINE,name:"Squamous epithelial cells",info:"Large, flat, irregular cells with a small central nucleus and folded edges. They usually mean contamination from the urethra or vagina, so the specimen may need recollection.",
 draw(){urineBg();for(const p of scatter(4,120,R*.75))squamous(p.x,p.y,rnd(80,105));for(let i=0;i<160;i++){g.fillStyle="rgba(55,55,45,.5)";g.fillRect(rnd(0,S),rnd(0,S),rnd(2,4),1.4)}}},
];
function diplo(x,y){const a=rnd(0,TAU),c=jit("#b8275a",10);for(const s of [-1,1]){g.save();g.translate(x+Math.cos(a)*s*3.2,y+Math.sin(a)*s*3.2);g.rotate(a);g.fillStyle=rgb(c);g.beginPath();g.ellipse(0,0,2.9,4.6,0,s<0?Math.PI*.5:-Math.PI*.5,s<0?Math.PI*1.5:Math.PI*.5);g.closePath();g.fill();g.restore()}}
const GROUPS={rbc:"Red cell morphology",wbc:"White cells",bug:"Stains & bugs",urine:"Urine sediment"};
// ================= game =================
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const LEVELS={student:{name:"Student",label:true,choices:4,time:0,pts:10},tech:{name:"Tech",label:false,choices:4,time:25,pts:15},path:{name:"Pathologist",label:false,choices:6,time:15,pts:25}};
let ST={mode:"duo",names:["Player 1","Player 2"],groups:Object.keys(GROUPS),per:6,lvl:"tech"};try{Object.assign(ST,JSON.parse(localStorage.getItem("uts-setup2")||"{}"))}catch(e){}
let G=null,tick=null;
function slideLabel(sp,show){const [a,b]=sp.slide.split("|");$("slide").innerHTML=show?`<span><b>${a}</b></span><span>${b}</span>`:`<span><b>Unknown slide</b></span><span>${b.split(" · ").pop()}</span>`}
function setup(){$("scores").hidden=true;$("timer").hidden=true;$("tag").textContent=`${SPEC.length} fields`;const sp=SPEC[Math.random()*SPEC.length|0];render(sp);slideLabel(sp,true);
  $("view").innerHTML=`<div class="panel"><p style="margin:0">Name what you see in the field. Every answer explains the key features.</p>
  <div class="lbl">Players</div><div class="seg"><button id="m1" aria-pressed="${ST.mode==='solo'}">Solo</button><button id="m2" aria-pressed="${ST.mode==='duo'}">Two players</button></div>
  ${ST.mode==='duo'?`<div class="row"><label class="field"><span>Player 1</span><input id="n1" maxlength="14" value="${esc(ST.names[0])}"></label><label class="field"><span>Player 2</span><input id="n2" maxlength="14" value="${esc(ST.names[1])}"></label></div>`:""}
  <div class="lbl">Difficulty</div><div class="seg">${Object.entries(LEVELS).map(([k,v])=>`<button data-l="${k}" aria-pressed="${ST.lvl===k}">${v.name}</button>`).join("")}</div>
  <p class="note">${{student:"Slide type shown · 4 choices · no clock",tech:"Slide type hidden · 4 choices · 25-second clock",path:"Slide type hidden · 6 choices from any bench · 15-second clock"}[ST.lvl]}</p>
  <div class="cats">${Object.entries(GROUPS).map(([k,v])=>`<label><input type="checkbox" value="${k}" ${ST.groups.includes(k)?"checked":""}>${v}</label>`).join("")}</div>
  <label class="field"><span>Fields each</span><input id="per" type="number" min="3" max="20" value="${ST.per}"></label>
  <button class="btn" id="go">Start</button></div>`;
  const keep=()=>{if($("n1"))ST.names=[$("n1").value.trim()||"Player 1",$("n2").value.trim()||"Player 2"];ST.groups=[...document.querySelectorAll(".cats input:checked")].map(i=>i.value);if(!ST.groups.length)ST.groups=Object.keys(GROUPS);ST.per=Math.max(3,Math.min(20,+$("per").value||6))};
  $("m1").onclick=()=>{keep();ST.mode="solo";setup()};$("m2").onclick=()=>{keep();ST.mode="duo";setup()};
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{keep();ST.lvl=b.dataset.l;setup()});
  $("go").onclick=()=>{keep();try{localStorage.setItem("uts-setup2",JSON.stringify(ST))}catch(e){}start()}}
function start(){const P=ST.mode==="solo"?1:2;const pool=SPEC.filter(s=>ST.groups.includes(s.grp));const need=ST.per*P,deck=[];while(deck.length<need)deck.push(...shuffle(pool));
  G={P,deck:deck.slice(0,need),i:0,score:Array(P).fill(0),right:Array(P).fill(0),streak:Array(P).fill(0)};$("scores").hidden=false;next()}
const cur=()=>G.i%G.P;
function scores(){$("scores").style.gridTemplateColumns=G.P===1?"1fr":"1fr 1fr";$("scores").innerHTML=G.score.map((s,p)=>`<div class="score ${p===cur()&&G.i<G.deck.length?"on":""}"><span class="n">${esc(G.P===1?"Score":ST.names[p])}</span><span class="v">${s}</span></div>`).join("")}
function next(){scores();clearInterval(tick);$("timer").hidden=true;if(G.i>=G.deck.length)return done();
  if(G.P===2){og.clearRect(0,0,S,S);$("slide").innerHTML="";$("view").innerHTML=`<div class="panel"><p class="big">${esc(ST.names[cur()])}, you're up</p><p class="muted">Pass the phone, then tap to look.</p><button class="btn" id="rdy">Look in the scope</button></div>`;$("rdy").onclick=ask}else ask()}
function ask(){const L=LEVELS[ST.lvl],sp=G.deck[G.i];render(sp);slideLabel(sp,L.label);$("tag").textContent=G.P===2?`Round ${Math.floor(G.i/2)+1}/${ST.per}`:`Field ${G.i+1}/${ST.per}`;
  const same=shuffle(SPEC.filter(s=>s.grp===sp.grp&&s.id!==sp.id)),other=shuffle(SPEC.filter(s=>s.grp!==sp.grp));
  const wrong=L.choices===6?[...same.slice(0,3),...other.slice(0,2)]:same.slice(0,3);while(wrong.length<L.choices-1)wrong.push(other.pop());
  const opts=shuffle([sp,...wrong]);
  $("view").innerHTML=`<div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.name)}</button>`).join("")}</div><div id="after" style="margin-top:12px"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.id));
  if(L.time){$("timer").hidden=false;const t0=performance.now();$("tbar").style.width="100%";tick=setInterval(()=>{const f=1-(performance.now()-t0)/(L.time*1000);$("tbar").style.width=Math.max(0,f*100)+"%";if(f<=0)answer(null)},100)}}
function answer(id){clearInterval(tick);const L=LEVELS[ST.lvl],sp=G.deck[G.i],ok=id===sp.id,p=cur();
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.id===sp.id)b.classList.add("right");else if(b.dataset.id===id)b.classList.add("wrong")});
  if(ok){G.streak[p]++;G.score[p]+=L.pts+Math.min(G.streak[p]-1,4)*5;G.right[p]++}else G.streak[p]=0;scores();slideLabel(sp,true);
  $("after").innerHTML=`<div class="why"><strong style="color:${ok?"var(--good)":"var(--bad)"}">${ok?"Correct"+(G.streak[p]>1?` · streak ${G.streak[p]}`:""):id===null?"Time's up · it's "+esc(sp.name):"It's "+esc(sp.name)}</strong>${esc(sp.info)}</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="nx">${G.i+1>=G.deck.length?"See results":G.P===2?"Next player":"Next field"}</button><button class="btn ghost" id="again">Another view</button></div>`;
  $("nx").onclick=()=>{G.i++;next()};$("again").onclick=()=>render(sp)}
function done(){$("tag").textContent="Round complete";const head=G.P===1?`${G.right[0]} of ${ST.per} correct`:G.score[0]===G.score[1]?"It's a tie":`${esc(ST.names[G.score[0]>G.score[1]?0:1])} wins`;
  $("view").innerHTML=`<div class="panel"><p class="big">${head}</p>${G.score.map((s,p)=>`<p class="muted">${esc(G.P===1?"Score":ST.names[p])}: ${s} pts · ${G.right[p]}/${ST.per}</p>`).join("")}<div class="row" style="justify-content:center"><button class="btn" id="pa">Play again</button><button class="btn ghost" id="cs">Change setup</button></div></div>`;
  $("pa").onclick=start;$("cs").onclick=setup}
window.__uts={SPEC,render};
setup();
})();
</script>

</body></html>
