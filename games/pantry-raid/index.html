<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Pantry Raid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#1b1410;--ink:#fff4e0;--muted:#c4a98a;--accent:#ffcf4a;--f-display:"Chewy","Comic Sans MS",sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#111;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

</style>
<div class="app">
  <div class="hud"><div class="title">Pantry Raid</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Swipe to steer the mouse · cheese makes the cats run</div>
</div>
<script>
(()=>{
const LW=342,LH=378,FONT="'Chewy', sans-serif";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}


const T=18,MAP=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.###.#.###.####",
"   #.#.......#.#   ",
"####.#.##-##.#.####",
"    ...#   #...    ",
"####.#.#####.#.####",
"   #.#.......#.#   ",
"####.#.#####.#.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const W=19,H=21,DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},OPP={u:"d",d:"u",l:"r",r:"l"};
let food,mouse,cats,score,lives,level,state="menu",best=getBest("pr-best"),fright=0,eatChain=0,banner="",bannerT=0,chomp=0;
const wall=(x,y,cat)=>{if(y===9&&(x<0||x>=W))return false;const c=(MAP[y]||"")[x];return c==="#"||c===undefined||(c==="-"&&!cat)};
function reset(){mouse={x:9,y:15,dir:"l",want:"l",p:0};
  cats=[{x:9,y:7,c:"#e85d5d",home:0},{x:8,y:9,c:"#f39ac2",home:2},{x:9,y:9,c:"#5ec4e8",home:5},{x:10,y:9,c:"#f2a33a",home:8}].map((c,i)=>({...c,dir:"l",p:0,mode:i?"house":"out",eyes:false,id:i}))}
function newLevel(){food=new Set();MAP.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==="."||c==="o")food.add(y*W+x+(c==="o"?1000:0))}));reset();fright=0;banner=`Level ${level}`;bannerT=1.5}
function newGame(){score=0;lives=3;level=1;newLevel();state="play";hud()}
function hud(){stats({Score:score,Best:Math.max(best,score),Lvl:level||1,"♥":lives??3})}
function has(x,y){return food.has(y*W+x)||food.has(y*W+x+1000)}
pointer({move:(l,dx,dy,p)=>{const ax=l.x-p.x0,ay=l.y-p.y0;if(Math.hypot(ax,ay)>14){mouse.want=Math.abs(ax)>Math.abs(ay)?(ax>0?"r":"l"):(ay>0?"d":"u");if(mouse.want===OPP[mouse.dir]&&!mouse.stuck&&mouse.p>0&&state==="play"){mouse.dir=mouse.want;mouse.p=1-mouse.p;mouse.x+=DIRS[mouse.want][0]*-1;mouse.y+=DIRS[mouse.want][1]*-1;}p.x0=l.x;p.y0=l.y}}});
addEventListener("keydown",e=>{const m={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r"}[e.key];if(m&&mouse)mouse.want=m});
// Entities sit at tile (x,y) heading `dir` with progress p in [0,1) toward the next tile.
function advance(e,speed,dt,choose){e.p+=speed*dt;while(e.p>=1){e.p-=1;e.x+=DIRS[e.dir][0];e.y+=DIRS[e.dir][1];if(e.x<-1)e.x=W;if(e.x>W)e.x=-1;choose(e)}}
function open(x,y,d,cat){return !wall(x+DIRS[d][0],y+DIRS[d][1],cat)}
function mouseChoose(m){if(m.x<0||m.x>=W)return;if(open(m.x,m.y,m.want))m.dir=m.want;else if(!open(m.x,m.y,m.dir)){m.p=0;m.stuck=true;return}m.stuck=false;eat(m.x,m.y)}
function eat(x,y){const k=y*W+x;if(food.has(k)){food.delete(k);score+=10;chomp=.15}if(food.has(k+1000)){food.delete(k+1000);score+=50;fright=Math.max(4,8-level);eatChain=0;for(const c of cats)if(c.mode==="out"&&!c.eyes){c.dir=OPP[c.dir]}}hud();
  if(!food.size){level++;score+=500;hud();newLevel()}}
function target(c){if(c.eyes)return [9,8];const m=mouse;if(c.id===0)return [m.x,m.y];if(c.id===1)return [m.x+DIRS[m.dir][0]*4,m.y+DIRS[m.dir][1]*4];
  if(c.id===2){const r=cats[0];return [2*(m.x+DIRS[m.dir][0]*2)-r.x,2*(m.y+DIRS[m.dir][1]*2)-r.y]}return Math.hypot(c.x-m.x,c.y-m.y)>8?[m.x,m.y]:[0,H]}
function catChoose(c){if(c.x<0||c.x>=W)return;
  if(c.eyes&&c.x===9&&c.y===8){c.eyes=false;c.mode="leave";}
  if(c.mode==="leave"){c.dir="u";if(c.y<=7){c.mode="out"}return}
  const opts=Object.keys(DIRS).filter(d=>d!==OPP[c.dir]&&open(c.x,c.y,d,c.eyes||c.mode!=="out"?true:false)&&!(d==="d"&&c.x===9&&c.y===7&&!c.eyes));
  if(!opts.length){c.dir=OPP[c.dir];return}
  if(fright>0&&!c.eyes){c.dir=pick(opts);return}
  const [tx,ty]=target(c);let bestD=1e9;for(const d of opts){const nx=c.x+DIRS[d][0],ny=c.y+DIRS[d][1],dd=(nx-tx)**2+(ny-ty)**2;if(dd<bestD){bestD=dd;c.dir=d}}}
let clock=0;
function update(dt){if(state!=="play")return;clock+=dt;
  if(bannerT>0){bannerT-=dt;return}
  const ms=5.2+level*.25;if(!mouse.stuck||open(mouse.x,mouse.y,mouse.want)){if(mouse.stuck&&open(mouse.x,mouse.y,mouse.want)){mouse.dir=mouse.want;mouse.stuck=false}if(!mouse.stuck)advance(mouse,ms,dt,mouseChoose)}
  fright=Math.max(0,fright-dt);chomp=Math.max(0,chomp-dt);
  cats.forEach((c,i)=>{if(c.mode==="house"){c.bob=(c.bob||0)+dt;if(c.bob>2+i*2.5){c.mode="leave";c.x=9;c.y=9;c.p=0;c.dir="u"}return}
    const sp=c.eyes?12:fright>0?3.2:(c.y===9&&(c.x<4||c.x>14))?2.6:4.4+level*.25;
    if(c.mode==="leave"){c.p+=sp*dt;while(c.p>=1){c.p-=1;c.y--;if(c.y<=7){c.y=7;c.mode="out";c.dir=pick(["l","r"])}}return}
    advance(c,sp,dt,catChoose)});
  const mp=pos(mouse);for(const c of cats){if(c.mode==="house"||c.eyes)continue;const cp=pos(c);if(Math.hypot(cp[0]-mp[0],cp[1]-mp[1])<11){
    if(fright>0){c.eyes=true;c.mode="out";eatChain++;const p=200*2**(eatChain-1);score+=p;burst(cp[0],cp[1],c.c,16,140);floaty.push({x:cp[0],y:cp[1],t:1,s:p});hud()}
    else{lives--;hud();burst(mp[0],mp[1],"#d9d2c5",30,160,1);if(lives<=0){state="over";if(score>best){best=score;setBest("pr-best",best)}setTimeout(()=>card(`<h1>Caught!</h1><p>Score ${score} · level ${level}</p><p class="sub">Best ${best}</p>`,"Sneak again",newGame),900)}else{reset();banner="Ready";bannerT=1.2}return}}}}
const floaty=[];
function pos(e){if(e.mode==="house")return [e.x*T+T/2,e.y*T+T/2+Math.sin(clock*4+e.id)*3];if(e.mode==="leave")return [e.x*T+T/2,(e.y-e.p)*T+T/2];return [(e.x+DIRS[e.dir][0]*e.p)*T+T/2,(e.y+DIRS[e.dir][1]*e.p)*T+T/2]}
function draw(){ctx.fillStyle="#2a1f18";ctx.fillRect(0,0,LW,LH);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=MAP[y][x];if(c==="#"){ctx.fillStyle="#8a5a33";ctx.fillRect(x*T,y*T,T,T);ctx.fillStyle="#a8723f";
      if(!wall(x,y-1))ctx.fillRect(x*T,y*T,T,3);ctx.fillStyle="#5e3b20";if(!wall(x,y+1))ctx.fillRect(x*T,y*T+T-3,T,3);ctx.fillStyle="rgba(0,0,0,.12)";ctx.fillRect(x*T+((x*7+y*3)%12),y*T+8,5,1)}
    else if(c==="-"){ctx.fillStyle="#f39ac2";ctx.fillRect(x*T,y*T+7,T,3)}
    else if((x+y)%2){ctx.fillStyle="#30241b";ctx.fillRect(x*T,y*T,T,T)}}
  if(food)for(const k of food){const big=k>=1000,kk=big?k-1000:k,x=(kk%W)*T+T/2,y=Math.floor(kk/W)*T+T/2;
    if(big){const s=1+Math.sin(clock*6)*.12;ctx.fillStyle="#ffcf4a";ctx.beginPath();ctx.moveTo(x-7*s,y+5*s);ctx.lineTo(x+7*s,y+5*s);ctx.lineTo(x+7*s,y-1*s);ctx.lineTo(x-7*s,y-6*s);ctx.closePath();ctx.fill();ctx.fillStyle="#e0a72a";ctx.beginPath();ctx.arc(x,y+1,1.6,0,7);ctx.arc(x+4,y+3,1.2,0,7);ctx.fill()}
    else{ctx.fillStyle="#f3e2bf";ctx.fillRect(x-2,y-2,4,4)}}
  if(cats)for(const c of cats){const [x,y]=pos(c),fr=fright>0&&!c.eyes&&c.mode!=="house";
    if(!c.eyes){ctx.fillStyle=fr?(fright<1.5&&Math.floor(clock*8)%2?"#f4f4f4":"#4b5cff"):c.c;ctx.beginPath();ctx.moveTo(x-8,y-2);ctx.lineTo(x-7,y-10);ctx.lineTo(x-3,y-6);ctx.lineTo(x+3,y-6);ctx.lineTo(x+7,y-10);ctx.lineTo(x+8,y-2);ctx.arc(x,y,8,0,Math.PI);ctx.closePath();ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-2,y+3);ctx.lineTo(x-9,y+1);ctx.moveTo(x+2,y+3);ctx.lineTo(x+9,y+1);ctx.stroke()}
    const [dx,dy]=c.mode==="out"?DIRS[c.dir]:[0,0];ctx.fillStyle=fr?"#fff":"#fffbe6";ctx.beginPath();ctx.ellipse(x-3.5,y-2,2.6,3,0,0,7);ctx.ellipse(x+3.5,y-2,2.6,3,0,0,7);ctx.fill();
    ctx.fillStyle="#1b1410";ctx.beginPath();ctx.ellipse(x-3.5+dx*1.2,y-2+dy*1.2,.9,2.2,0,0,7);ctx.ellipse(x+3.5+dx*1.2,y-2+dy*1.2,.9,2.2,0,0,7);ctx.fill()}
  if(mouse&&state==="play"){const [x,y]=pos(mouse),a={r:0,d:Math.PI/2,l:Math.PI,u:-Math.PI/2}[mouse.dir];ctx.save();ctx.translate(x,y);ctx.rotate(a);
    ctx.strokeStyle="#e8a1a8";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-7,0);ctx.quadraticCurveTo(-12,Math.sin(clock*12)*4,-14,0);ctx.stroke();
    ctx.fillStyle="#cfc6ba";ctx.beginPath();ctx.ellipse(-1,0,7,6,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(5,0,5,4,0,0,7);ctx.fill();
    ctx.fillStyle="#e8a1a8";ctx.beginPath();ctx.arc(1,-6,3.2,0,7);ctx.arc(1,6,3.2,0,7);ctx.fill();ctx.fillStyle="#1b1410";ctx.beginPath();ctx.arc(9.5,0,1.4,0,7);ctx.arc(6,-2,1,0,7);ctx.arc(6,2,1,0,7);ctx.fill();
    if(chomp>0){ctx.fillStyle="#f3e2bf";ctx.fillRect(9,-1,3,2)}ctx.restore()}
  for(let i=floaty.length-1;i>=0;i--){const f=floaty[i];f.t-=1/60;text(String(f.s),f.x,f.y-(1-f.t)*14,12,"#9fd8ff");if(f.t<=0)floaty.splice(i,1)}
  drawParts();if(bannerT>0&&state==="play")text(banner,LW/2,9*T+T/2,22,"#ffcf4a")}
loop(dt=>{update(dt);stepParts(dt);draw()});
fit();level=1;newLevel();bannerT=0;hud();
card(`<h1>Pantry Raid</h1><p>Sneak the mouse through the pantry and eat every crumb. Grab a cheese wedge and the cats turn blue. That's your chance to chase them back to their box.</p><p class="sub">Swipe in any direction to steer. Swipe early to turn at the next opening.</p>`,"Sneak in",newGame);

})();
</script>

</body></html>
