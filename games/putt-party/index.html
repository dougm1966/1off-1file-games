<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Putt Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#123222;--ink:#f2fbe9;--muted:#a9cfa9;--accent:#ffd34d;--f-display:"Lilita One","Arial Black",sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#2b1f00;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.card{max-height:calc(100% - 16px);overflow:auto}
.setl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;margin-top:2px}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--muted) 40%,transparent);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:36px;border:0;border-radius:0;background:transparent;color:var(--ink);font:600 13px system-ui,sans-serif;padding:0 4px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#2b1f00}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lvls button{height:38px;border-radius:8px;font:700 15px system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid color-mix(in srgb,var(--muted) 40%,transparent)}
.lvls button[aria-pressed=true]{background:var(--accent);color:#2b1f00;border-color:var(--accent)}
.lvls button:disabled{opacity:.45;cursor:default}
.chal{text-align:left;font-size:13px;color:var(--muted)}.chal summary{cursor:pointer;font-weight:700;color:var(--ink)}.chal div{padding:2px 0}.chal .ok{color:var(--accent)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--accent);color:var(--ink);padding:6px 12px;border-radius:999px;font:600 13px system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
</style>
<div class="app">
  <div class="hud"><div class="title">Putt Party</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Drag back anywhere like a slingshot · release to putt</div>
</div>
<script>
(()=>{
const LW=360,LH=600,FONT="system-ui, sans-serif";
const TAU=Math.PI*2;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
// ---- menus with settings, level select and challenges (saved per game) ----
let SAVE={settings:{},unlocked:1,done:{},best:{}};const SKEY="save-"+document.title;
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(SKEY)||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}};
function setting(k,d){return SAVE.settings[k]??d}
let CHAL=[];
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";stage.appendChild(t)}t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2200)}
function award(id){if(SAVE.done[id])return;const c=CHAL.find(c=>c.id===id);if(!c)return;SAVE.done[id]=1;persist();toast("Challenge done: "+c.text)}
function unlock(n){if(n>SAVE.unlocked){SAVE.unlocked=n;persist()}}
// cfg: {title, html, settings:[{k,label,opts:[[value,label],...],def}], levels:[names]|null, challenges:[{id,text}], play:"Play"}
function menu(cfg,onStart){CHAL=cfg.challenges||[];const o=document.getElementById("over"),c=document.getElementById("card");let lvl=Math.min(setting("_lvl",1),SAVE.unlocked);
  const draw=()=>{const done=CHAL.filter(x=>SAVE.done[x.id]).length;
    c.innerHTML=`<h1>${cfg.title}</h1>${cfg.html||""}
    ${(cfg.settings||[]).map(s=>`<div class="setl">${s.label}</div><div class="seg">${s.opts.map(([v,l])=>`<button data-k="${s.k}" data-v="${v}" aria-pressed="${String(setting(s.k,s.def))===String(v)}">${l}</button>`).join("")}</div>`).join("")}
    ${cfg.levels?`<div class="setl">Level</div><div class="lvls">${cfg.levels.map((n,i)=>`<button data-lv="${i+1}" ${i+1>SAVE.unlocked?"disabled":""} aria-pressed="${lvl===i+1}" title="${n}">${i+1>SAVE.unlocked?"🔒":i+1}</button>`).join("")}</div><div class="sub">${cfg.levels[lvl-1]}</div>`:""}
    ${CHAL.length?`<details class="chal"><summary>Challenges ${done}/${CHAL.length}</summary>${CHAL.map(x=>`<div class="${SAVE.done[x.id]?"ok":""}">${SAVE.done[x.id]?"✓":"○"} ${x.text}</div>`).join("")}</details>`:""}
    <button id="go">${cfg.play||"Play"}</button>`;
    c.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{SAVE.settings[b.dataset.k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;persist();draw()});
    c.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lvl=+b.dataset.lv;SAVE.settings._lvl=lvl;persist();draw()});
    document.getElementById("go").onclick=()=>{o.hidden=true;onStart(lvl)}};
  draw();o.hidden=false}


const BR=7;
const box=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
const H=[
 {par:2,tee:[180,500],cup:[180,110],walls:[box(60,60,240,480)]},
 {par:3,tee:[110,480],cup:[250,130],walls:[[[60,530],[160,530],[160,200],[300,200],[300,70],[60,70]]]},
 {par:2,tee:[180,500],cup:[180,110],walls:[box(50,60,260,480),box(130,250,100,100)]},
 {par:3,tee:[180,500],cup:[180,110],walls:[box(60,60,240,480)],sand:[[90,220,180,90]]},
 {par:3,tee:[180,500],cup:[180,110],walls:[box(40,60,280,480)],water:[[40,260,190,80]]},
 {par:3,tee:[180,500],cup:[180,110],walls:[box(80,60,200,480)],mills:[{x:180,y:300,L:78,w:1.6}]},
 {par:3,tee:[180,500],cup:[180,110],walls:[box(60,60,240,480)],slopes:[[60,170,240,200,0,140]]},
 {par:4,tee:[290,500],cup:[80,110],walls:[box(40,60,280,480)],segs:[[40,390,230,390],[130,240,320,240]]},
 {par:3,tee:[180,500],cup:[180,110],walls:[box(50,60,260,480)],bumps:[[130,300,20],[230,300,20],[180,215,20]]},
 {par:4,tee:[100,110],cup:[260,110],walls:[[[40,540],[320,540],[320,60],[200,60],[200,400],[160,400],[160,60],[40,60]]]},
 {par:3,tee:[180,500],cup:[180,110],walls:[box(40,60,280,480)],water:[[40,250,115,60],[205,250,115,60]]},
 {par:3,tee:[180,500],cup:[130,120],walls:[box(60,60,240,480)],slopes:[[60,290,240,120,110,0]],sand:[[200,140,100,80]]},
 {par:3,tee:[180,500],cup:[180,100],walls:[[[60,540],[300,540],[300,400],[200,300],[200,60],[160,60],[160,300],[60,400]]]},
 {par:4,tee:[180,500],cup:[180,110],walls:[box(80,60,200,480)],mills:[{x:180,y:385,L:78,w:1.5},{x:180,y:225,L:78,w:-2}]},
 {par:4,tee:[80,500],cup:[200,110],walls:[box(40,60,280,480)],segs:[[40,420,240,420],[120,300,320,300],[40,180,240,180]]},
 {par:2,tee:[180,500],cup:[180,110],walls:[box(40,60,280,480)],slopes:[[40,140,140,300,90,-30],[180,140,140,300,-90,-30]]},
 {par:3,tee:[180,500],cup:[180,110],walls:[box(40,60,280,480)],water:[[40,380,130,50],[190,300,130,50],[40,200,130,50]]},
 {par:4,tee:[180,500],cup:[180,110],walls:[box(60,60,240,480)],water:[[60,330,80,60],[220,330,80,60]],mills:[{x:180,y:360,L:62,w:1.8}],sand:[[120,165,120,45]]},
];
const LEVELS=["Front nine","Back nine","All eighteen"];
let hole=0,first=0,last=9,ball,players,pi=0,strokes=0,state="menu",aimS=null,aimP=null,lastSafe=null,sunk=0,mt=0,wet=false;
function np(){return setting("players",2)}
function start(lv){first=lv===2?9:0;last=lv===1?9:lv===2?18:18;players=Array.from({length:np()},(_,i)=>({name:np()===1?"You":"P"+(i+1),cards:[],wet:false}));hole=first;pi=0;setupHole();state="play"}
function setupHole(){const h=H[hole];ball={x:h.tee[0],y:h.tee[1],vx:0,vy:0};lastSafe={x:ball.x,y:ball.y};strokes=0;sunk=0;hud()}
function tot(p){return p.cards.reduce((a,b)=>a+b,0)}
function hud(){const h=H[hole];stats({Hole:`${hole+1} · par ${h.par}`,[players[pi].name]:strokes,Total:tot(players[pi])})}
function segsOf(h){const s=[];for(const poly of h.walls)for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s.push([a[0],a[1],b[0],b[1]])}for(const q of h.segs||[])s.push(q);return s}
function inRect(r,x,y){return x>r[0]&&x<r[0]+r[2]&&y>r[1]&&y<r[1]+r[3]}
pointer({down:l=>{if(state!=="play"||moving())return;aimS=l;aimP=l},move:l=>{if(aimS)aimP=l},up:()=>{if(!aimS)return;const dx=aimS.x-aimP.x,dy=aimS.y-aimP.y,d=Math.hypot(dx,dy);aimS=null;if(d<8)return;const pw=Math.min(d,150)/150;ball.vx=dx/d*pw*720;ball.vy=dy/d*pw*720;strokes++;hud()}});
function moving(){return Math.hypot(ball.vx,ball.vy)>4}
function collideSeg(s,mvx=0,mvy=0){const [x1,y1,x2,y2]=s,dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy;let t=clamp(((ball.x-x1)*dx+(ball.y-y1)*dy)/L2,0,1);const cx=x1+dx*t,cy=y1+dy*t;let nx=ball.x-cx,ny=ball.y-cy;const d=Math.hypot(nx,ny);
  if(d>=BR+2.5||d<1e-6)return;nx/=d;ny/=d;ball.x=cx+nx*(BR+2.5);ball.y=cy+ny*(BR+2.5);const rvx=ball.vx-mvx,rvy=ball.vy-mvy,vn=rvx*nx+rvy*ny;if(vn<0){ball.vx-=1.75*vn*nx;ball.vy-=1.75*vn*ny}}
function step(dt){const h=H[hole];mt+=dt;
  let fr=150;for(const r of h.sand||[])if(inRect(r,ball.x,ball.y))fr=650;for(const r of h.slopes||[])if(inRect(r,ball.x,ball.y)){ball.vx+=r[4]*dt;ball.vy+=r[5]*dt}
  const sp=Math.hypot(ball.vx,ball.vy);if(sp>0){const ns=Math.max(0,sp-(fr+sp*.5)*dt);ball.vx*=ns/sp;ball.vy*=ns/sp}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  for(const s of segsOf(h))collideSeg(s);
  for(const m of h.mills||[]){const a=mt*m.w,cx=Math.cos(a)*m.L,cy=Math.sin(a)*m.L;const s=[m.x-cx,m.y-cy,m.x+cx,m.y+cy];
    const px=ball.x-m.x,py=ball.y-m.y;collideSeg(s,-m.w*py,m.w*px)}
  for(const b of h.bumps||[]){const dx=ball.x-b[0],dy=ball.y-b[1],d=Math.hypot(dx,dy);if(d<b[2]+BR){const nx=dx/d,ny=dy/d;ball.x=b[0]+nx*(b[2]+BR);ball.y=b[1]+ny*(b[2]+BR);const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=2.1*vn*nx;ball.vy-=2.1*vn*ny}}}
  const cd=Math.hypot(ball.x-h.cup[0],ball.y-h.cup[1]),v=Math.hypot(ball.vx,ball.vy);
  if(cd<9){if(v<340){holed();return}else{ball.vx+=(ball.x-h.cup[0])*2;ball.vy+=(ball.y-h.cup[1])*2}}else if(cd<14&&v<120){ball.vx-=(ball.x-h.cup[0])*4*dt*10;ball.vy-=(ball.y-h.cup[1])*4*dt*10}
  for(const r of h.water||[])if(inRect(r,ball.x,ball.y)){burst(ball.x,ball.y,"#7fd3ff",14,90);ball.x=lastSafe.x;ball.y=lastSafe.y;ball.vx=ball.vy=0;strokes++;players[pi].wet=true;toast("Splash! +1 stroke");hud();return}
  if(!moving()){ball.vx=ball.vy=0;lastSafe={x:ball.x,y:ball.y};if(strokes>=+setting("max",8)){toast("Max strokes, ball picked up");strokes=+setting("max",8);finishPlayer()}}}
function holed(){ball.vx=ball.vy=0;ball.x=H[hole].cup[0];ball.y=H[hole].cup[1];sunk=1;burst(ball.x,ball.y,"#ffd34d",24,140);const par=H[hole].par,d=strokes-par;
  toast(strokes===1?"HOLE IN ONE!":d<=-2?"Eagle!":d===-1?"Birdie!":d===0?"Par":d===1?"Bogey":`+${d}`);if(strokes===1)award("ace");if(d<0)award("birdie");setTimeout(finishPlayer,900)}
function finishPlayer(){players[pi].cards[hole-first]=strokes;if(pi<players.length-1){pi++;setupHole();toast(`${players[pi].name}'s turn`)}else{pi=0;hole++;if(hole>=last){endRound();return}setupHole();if(players.length>1)toast(`Hole ${hole+1} · ${players[0].name} first`)}}
function endRound(){state="over";const parT=H.slice(first,last).reduce((a,h)=>a+h.par,0);const res=players.map(p=>({p,t:tot(p)})).sort((a,b)=>a.t-b.t);
  for(const r of res){if(r.t<parT)award("under");if(!r.p.wet)award("dry")}if(last-first===18||(first===0&&last===18))award("full");if(players.length>1)award("match");
  const rel=t=>{const d=t-parT;return d===0?"E":d>0?"+"+d:String(d)};
  card(`<h1>${players.length>1?res[0].p.name+" wins":"Round complete"}</h1>${res.map(r=>`<p>${r.p.name}: <b>${r.t}</b> (${rel(r.t)})</p>`).join("")}<p class="sub">Par ${parT}</p>`,"Menu",openMenu)}
function draw(){ctx.fillStyle="#123222";ctx.fillRect(0,0,LW,LH);if(state==="menu"&&!ball)return;const h=H[hole];
  ctx.save();ctx.beginPath();for(const poly of h.walls.slice(0,1)){poly.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath()}ctx.clip();
  for(let y=0;y<LH;y+=24){ctx.fillStyle=(y/24)%2?"#3fae5a":"#46b862";ctx.fillRect(0,y,LW,24)}
  for(const r of h.sand||[]){ctx.fillStyle="#e8d39a";rr(r[0],r[1],r[2],r[3],20);ctx.fill();ctx.fillStyle="rgba(170,140,80,.4)";for(let i=0;i<40;i++)ctx.fillRect(r[0]+((i*37)%r[2]),r[1]+((i*53)%r[3]),2,2)}
  for(const r of h.water||[]){ctx.fillStyle="#3a8fd8";rr(r[0],r[1],r[2],r[3],10);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1.5;for(let i=0;i<3;i++){const yy=r[1]+r[3]*(i+1)/4;ctx.beginPath();for(let x=r[0]+6;x<r[0]+r[2]-6;x+=4)ctx.lineTo(x,yy+Math.sin(x/8+mt*3)*2);ctx.stroke()}}
  for(const r of h.slopes||[]){ctx.fillStyle="rgba(0,60,20,.12)";ctx.fillRect(r[0],r[1],r[2],r[3]);const a=Math.atan2(r[5],r[4]);ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;for(let i=0;i<6;i++){const x=r[0]+r[2]*((i%3)+.5)/3,y=r[1]+r[3]*(Math.floor(i/3)+.5)/2+((mt*20)%20)*Math.sin(a);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(-8,-6);ctx.lineTo(4,0);ctx.lineTo(-8,6);ctx.stroke();ctx.restore()}}
  ctx.restore();
  for(const poly of h.walls.slice(1)){ctx.fillStyle="#6a3f1e";ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
  ctx.lineCap="round";ctx.lineJoin="round";for(const s of segsOf(h)){ctx.strokeStyle="#7a4a24";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);ctx.stroke();ctx.strokeStyle="#b07240";ctx.lineWidth=3;ctx.stroke()}
  for(const b of h.bumps||[]){ctx.fillStyle="#d9485f";ctx.beginPath();ctx.arc(b[0],b[1],b[2],0,TAU);ctx.fill();ctx.fillStyle="#ff8fa3";ctx.beginPath();ctx.arc(b[0]-5,b[1]-5,b[2]*.4,0,TAU);ctx.fill()}
  for(const m of h.mills||[]){const a=mt*m.w,cx=Math.cos(a)*m.L,cy=Math.sin(a)*m.L;ctx.strokeStyle="#f2fbe9";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(m.x-cx,m.y-cy);ctx.lineTo(m.x+cx,m.y+cy);ctx.stroke();ctx.strokeStyle="#d9485f";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#7a4a24";ctx.beginPath();ctx.arc(m.x,m.y,7,0,TAU);ctx.fill()}
  ctx.lineCap="butt";
  ctx.fillStyle="#0c1a10";ctx.beginPath();ctx.arc(h.cup[0],h.cup[1],9,0,TAU);ctx.fill();if(!sunk){ctx.strokeStyle="#ddd";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(h.cup[0],h.cup[1]);ctx.lineTo(h.cup[0],h.cup[1]-34);ctx.stroke();ctx.fillStyle="#ff4f5e";ctx.beginPath();ctx.moveTo(h.cup[0],h.cup[1]-34);ctx.lineTo(h.cup[0]+18,h.cup[1]-28);ctx.lineTo(h.cup[0],h.cup[1]-22);ctx.fill()}
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(h.tee[0]-10,h.tee[1]-2,20,4);
  if(aimS&&setting("guide","on")==="on"){const dx=aimS.x-aimP.x,dy=aimS.y-aimP.y,d=Math.hypot(dx,dy);if(d>8){const pw=Math.min(d,150)/150;ctx.strokeStyle=`hsl(${120-pw*120},90%,60%)`;ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+dx/d*(30+pw*90),ball.y+dy/d*(30+pw*90));ctx.stroke();ctx.setLineDash([]);text(Math.round(pw*100)+"%",ball.x,ball.y+26,13,"#fff")}}
  if(!sunk){ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(ball.x+2,ball.y+3,BR,BR*.8,0,0,TAU);ctx.fill();const g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,BR);g.addColorStop(0,"#fff");g.addColorStop(1,["#e8e8e8","#ffe08a","#9fd8ff","#ffb3c7"][pi%4]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,TAU);ctx.fill()}
  text(`${players[pi].name} · hole ${hole+1}`,LW/2,26,16,"#ffd34d");drawParts()}
loop(dt=>{if(state==="play"){const n=6;for(let i=0;i<n&&!sunk;i++)step(dt/n);if(sunk)mt+=dt}else mt+=dt;stepParts(dt);draw()});

  settings:[{k:"players",label:"Players",def:2,opts:[[1,"1"],[2,"2"],[3,"3"],[4,"4"]]},{k:"max",label:"Max strokes per hole",def:8,opts:[[6,"6"],[8,"8"],[10,"10"]]},{k:"guide",label:"Aim arrow",def:"on",opts:[["on","On"],["off","Off"]]}],
  levels:LEVELS,challenges:[{id:"ace",text:"Make a hole in one"},{id:"birdie",text:"Make a birdie"},{id:"under",text:"Finish a round under par"},{id:"dry",text:"Finish a round without hitting water"},{id:"full",text:"Play all 18"},{id:"match",text:"Finish a multiplayer round"}],play:"Tee off"},lv=>{SAVE.unlocked=3;start(lv)})}
