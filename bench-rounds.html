<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Bench Rounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single column quiz card styled like a specimen label; category color = the matching tube-cap color */
:root{
  --bg:#eef1f4;--card:#ffffff;--ink:#16202b;--muted:#5d6b79;--line:#d5dce3;--accent:#0f6e8c;--good:#1f8a4c;--bad:#c23a2b;
  --lav:#8c6bc8;--gold:#d9a521;--blue:#4aa3d8;--pink:#e46aa0;--yellow:#e3c72b;--green:#3c9a5a;--gray:#7b8794;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--card:#18212a;--ink:#e6edf3;--muted:#93a3b2;--line:#2a3642;--accent:#5bc0de;--good:#4cc27c;--bad:#ef6a5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151b;--card:#18212a;--ink:#e6edf3;--muted:#93a3b2;--line:#2a3642;--accent:#5bc0de;--good:#4cc27c;--bad:#ef6a5a;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
.app{max-width:560px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{margin:0;font-family:var(--f-head);font-size:26px;letter-spacing:.01em}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cap{height:12px}
.label{padding:16px;display:grid;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%}
.q{font-size:19px;font-weight:600;line-height:1.35;text-wrap:balance;margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt:disabled{cursor:default}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--ink);font-size:15px}
.why strong{display:block;font-family:var(--f-head);letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.btn{height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-family:var(--f-head);font-weight:700;font-size:17px;letter-spacing:.04em;cursor:pointer;padding:0 18px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.score.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.score .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.score .v{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:14px;cursor:pointer;background:var(--bg)}
.cats input{accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:4px;flex:1;min-width:140px}
.field span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.field input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:42px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.big{font-family:var(--f-head);font-size:28px;font-weight:700;margin:0}
.muted{color:var(--muted)}
</style>
<div class="app">
  <header><h1>Bench Rounds</h1><span class="tag" id="tag">Lab trivia</span></header>
  <div class="scores" id="scores" hidden></div>
  <main id="view"></main>
</div>
<script>
(()=>{
// Category colors follow tube caps / bench conventions.
const CATS={
 heme:{name:"Hematology",c:"var(--lav)"},
 coag:{name:"Coagulation",c:"var(--blue)"},
 chem:{name:"Chemistry",c:"var(--gold)"},
 micro:{name:"Microbiology",c:"var(--green)"},
 bb:{name:"Blood Bank",c:"var(--pink)"},
 ua:{name:"Urinalysis",c:"var(--yellow)"},
 qc:{name:"QC & Lab Ops",c:"var(--gray)"},
};
// [cat, question, correct, wrong1, wrong2, wrong3, explanation]
const Q=[
["heme","What is the normal lifespan of a circulating red blood cell?","About 120 days","About 30 days","About 60 days","About 365 days","RBCs circulate roughly 120 days before the spleen and liver macrophages remove them."],
["heme","Which anticoagulant is in a lavender-top tube?","K2EDTA (or K3EDTA)","Sodium citrate","Lithium heparin","Sodium fluoride","EDTA chelates calcium and preserves cell morphology, which makes it the CBC tube."],
["heme","What is the most numerous white blood cell in a normal adult peripheral smear?","Segmented neutrophil","Lymphocyte","Monocyte","Eosinophil","Neutrophils typically make up about 40–70% of the adult differential."],
["heme","A cell with a bilobed nucleus and large orange-red granules is a(n):","Eosinophil","Basophil","Neutrophil","Monocyte","Eosinophil granules stain orange-red with eosin; basophil granules are dark purple-black."],
["heme","Auer rods in blasts point most strongly toward:","Acute myeloid leukemia","Acute lymphoblastic leukemia","Chronic lymphocytic leukemia","Infectious mononucleosis","Auer rods are fused primary (azurophilic) granules seen in myeloid blasts."],
["heme","Howell-Jolly bodies are made of:","Nuclear (DNA) remnants","Denatured hemoglobin","Precipitated RNA","Iron granules","They are DNA remnants, classically seen after splenectomy or in hyposplenism."],
["heme","Schistocytes on a smear are most associated with:","Microangiopathic hemolytic anemia (e.g. DIC, TTP, HUS)","Iron deficiency anemia","Hereditary spherocytosis","Lead poisoning","Red cells are sheared as they pass fibrin strands or damaged small vessels."],
["heme","Which stain is used to count reticulocytes?","New methylene blue (supravital)","Wright stain","Prussian blue","Crystal violet","A supravital stain precipitates residual RNA in living reticulocytes."],
["heme","How is MCV calculated?","(Hct ÷ RBC count) × 10","(Hgb ÷ RBC count) × 10","(Hgb ÷ Hct) × 100","(RBC count ÷ Hct) × 10","With Hct in % and RBC in ×10¹²/L, the result is in femtoliters."],
["heme","Typical indices in iron deficiency anemia are:","Microcytic, hypochromic","Macrocytic, normochromic","Normocytic, normochromic","Macrocytic, hyperchromic","Low iron limits hemoglobin synthesis, producing small, pale cells (low MCV and MCH)."],
["heme","Hemoglobin S results from which substitution in the beta chain?","Valine for glutamic acid at position 6","Lysine for glutamic acid at position 6","Glutamic acid for valine at position 6","Valine for lysine at position 26","The same position with lysine instead gives hemoglobin C."],
["heme","Heinz bodies are classically associated with:","G6PD deficiency","Lead poisoning","Post-splenectomy state","Iron overload","Heinz bodies are denatured hemoglobin and need a supravital stain to see."],
["heme","Platelet clumping in an EDTA tube can cause:","A falsely low platelet count","A falsely high platelet count","A falsely low WBC count","A falsely low hemoglobin","EDTA-dependent clumping is often resolved by recollecting in sodium citrate."],
["heme","Hereditary spherocytosis typically shows:","Increased osmotic fragility","Decreased osmotic fragility","A positive DAT","Target cells as the main finding","Spherocytes have less membrane per volume, so they lyse more easily in hypotonic saline."],
["coag","What additive is in a light-blue-top tube?","3.2% sodium citrate","EDTA","Sodium heparin","Potassium oxalate","Citrate binds calcium reversibly; calcium is added back during the PT and aPTT."],
["coag","The proper blood-to-anticoagulant ratio for a citrate tube is:","9:1","4:1","1:1","19:1","An underfilled tube has excess citrate, which falsely prolongs clotting times."],
["coag","Which test is used to monitor warfarin therapy?","PT / INR","aPTT","Thrombin time","Bleeding time","Warfarin lowers vitamin K-dependent factors II, VII, IX and X; factor VII's short half-life makes the PT most responsive."],
["coag","Unfractionated heparin is traditionally monitored with the:","aPTT (or anti-Xa)","PT","Platelet count only","D-dimer","Heparin works through antithrombin and prolongs the intrinsic and common pathways."],
["coag","The INR calculation uses the PT ratio raised to the power of the:","ISI (International Sensitivity Index)","Mean normal PT","Factor VII level","Reagent lot number","INR = (patient PT ÷ mean normal PT)^ISI, which standardizes across thromboplastins."],
["coag","Which coagulation factor is NOT vitamin K-dependent?","Factor VIII","Factor II","Factor VII","Factor X","The vitamin K-dependent factors are II, VII, IX and X, plus proteins C and S."],
["coag","An elevated D-dimer indicates:","Breakdown of cross-linked fibrin","Platelet dysfunction","Vitamin K deficiency","Factor VIII deficiency","D-dimer is formed when plasmin degrades fibrin that factor XIII has cross-linked."],
["chem","What is in a gray-top tube?","Sodium fluoride / potassium oxalate","Lithium heparin","Clot activator and gel","Sodium citrate","Fluoride inhibits glycolysis, preserving glucose."],
["chem","A hemolyzed specimen will falsely increase which analyte the most?","Potassium","Sodium","Glucose","Albumin","Red cells hold far more potassium than plasma does. LD and AST also rise."],
["chem","Hemoglobin A1c reflects average glucose over roughly:","2–3 months","2–3 days","2–3 weeks","6–12 months","Glycation tracks the lifespan of the red cell."],
["chem","Which marker is preferred for detecting myocardial injury?","Cardiac troponin (I or T)","CK-MB","Myoglobin","AST","Troponin is the most sensitive and specific marker of myocardial damage."],
["chem","The anion gap is usually calculated as:","Na⁺ − (Cl⁻ + HCO₃⁻)","(Na⁺ + K⁺) − Cl⁻","Cl⁻ − (Na⁺ + HCO₃⁻)","Na⁺ + Cl⁻ − HCO₃⁻","Some labs also add K⁺. An increased gap suggests unmeasured anions such as lactate or ketones."],
["chem","What is the normal arterial blood pH range?","7.35–7.45","7.25–7.35","7.45–7.55","6.95–7.05",""],
["chem","Bilirubin specimens should be protected from:","Light","Cold","Agitation","Oxygen","Light breaks down bilirubin, falsely lowering the result."],
["chem","Beer's law states that absorbance is directly proportional to:","Concentration","Wavelength","Transmittance","Temperature","A = εbc. Absorbance rises linearly with concentration over the linear range."],
["chem","A BUN-to-creatinine ratio above 20:1 most suggests:","Prerenal azotemia (e.g. dehydration)","Intrinsic renal failure","Liver failure","Low protein intake","Reduced renal perfusion increases urea reabsorption more than creatinine."],
["chem","In hemolytic anemia, which bilirubin fraction rises most?","Unconjugated (indirect)","Conjugated (direct)","Delta bilirubin","Urine bilirubin","Excess heme breakdown outpaces the liver's conjugation capacity."],
["chem","By CLSI order of draw, which is collected first?","Blood culture bottles","Light-blue (citrate)","Lavender (EDTA)","Red / gold (serum)","Order: blood cultures, citrate, serum, heparin, EDTA, then fluoride/oxalate."],
["micro","In a Gram stain, what is the primary stain?","Crystal violet","Safranin","Iodine","Methylene blue","The order is crystal violet, iodine (mordant), alcohol/acetone decolorizer, then safranin counterstain."],
["micro","Gram-positive bacteria appear what color?","Purple","Pink / red","Blue-green","Colorless","Their thick peptidoglycan retains the crystal violet–iodine complex."],
["micro","Which test separates Staphylococcus from Streptococcus?","Catalase","Coagulase","Oxidase","Bile solubility","Staphylococci are catalase-positive; streptococci are catalase-negative."],
["micro","Which test separates S. aureus from coagulase-negative staphylococci?","Coagulase","Catalase","Optochin","Bacitracin",""],
["micro","Which stain is used for Mycobacterium?","Acid-fast (Ziehl-Neelsen or Kinyoun)","Gram stain","India ink","Giemsa","Mycolic acids in the cell wall retain carbol fuchsin after acid-alcohol decolorizing."],
["micro","On MacConkey agar, lactose fermenters appear:","Pink","Colorless","Black","Green with a metallic sheen","MacConkey selects for gram-negatives; lactose fermentation drops the pH, turning colonies pink."],
["micro","Beta hemolysis on blood agar means:","Complete clearing around colonies","Greenish partial hemolysis","No hemolysis","A halo only under anaerobic conditions","Alpha is partial (green), and gamma is none."],
["micro","Optochin-susceptible, bile-soluble alpha-hemolytic cocci are:","Streptococcus pneumoniae","Viridans streptococci","Enterococcus faecalis","Streptococcus agalactiae","Viridans group streptococci are optochin-resistant and bile-insoluble."],
["micro","Which organism is classically presumptively identified as bacitracin (A disk) susceptible?","Streptococcus pyogenes (group A)","Streptococcus agalactiae (group B)","Staphylococcus epidermidis","Enterococcus faecium",""],
["micro","Haemophilus influenzae requires which growth factors?","X (hemin) and V (NAD)","X only","V only","Neither","That's why it grows on chocolate agar, not sheep blood agar (except as satellites near S. aureus)."],
["micro","An India ink prep of CSF showing encapsulated yeast suggests:","Cryptococcus neoformans","Candida albicans","Histoplasma capsulatum","Aspergillus fumigatus","The polysaccharide capsule makes a clear halo against the ink. Antigen testing is now preferred."],
["micro","A yeast that is germ-tube positive is most likely:","Candida albicans","Cryptococcus neoformans","Candida glabrata","Saccharomyces cerevisiae","C. dubliniensis can also be germ-tube positive."],
["micro","Oxidase-positive, non-fermenting gram-negative rod with a grape-like odor and green pigment:","Pseudomonas aeruginosa","Escherichia coli","Klebsiella pneumoniae","Proteus mirabilis","The green comes from pyocyanin plus pyoverdin."],
["micro","Thayer-Martin agar is designed to isolate:","Neisseria gonorrhoeae","Haemophilus influenzae","Bordetella pertussis","Legionella pneumophila","It's selective chocolate agar with antimicrobials that suppress normal flora."],
["micro","Mycobacterium tuberculosis cultures should be handled at which biosafety level?","BSL-3","BSL-1","BSL-2","BSL-4",""],
["bb","Which red cell donor type is considered universal for emergency release?","Group O, Rh-negative","Group AB, Rh-positive","Group A, Rh-negative","Group B, Rh-negative","O red cells lack A and B antigens. O-negative is preferred when the recipient's type is unknown."],
["bb","The universal donor for plasma is group:","AB","O","A","B","AB plasma contains neither anti-A nor anti-B."],
["bb","A group O person naturally has which antibodies?","Anti-A and anti-B","Anti-A only","Anti-B only","Neither","These are mostly IgM, formed without prior red cell exposure."],
["bb","The direct antiglobulin test (DAT) detects:","Antibody or complement already bound to red cells in vivo","Free antibody in the patient's plasma","ABO type","Rh antigen weakness only","The indirect test (IAT, as in an antibody screen) detects antibody in plasma that binds in vitro."],
["bb","Rh immune globulin is given to:","Rh-negative mothers with an Rh-positive (or unknown) fetus","Rh-positive mothers","Rh-negative newborns","Any group O mother","It prevents alloimmunization to the D antigen."],
["bb","Red blood cell units are stored at:","1–6 °C","20–24 °C with agitation","−18 °C or colder","37 °C","Platelets are kept at 20–24 °C with agitation, and plasma frozen at −18 °C or colder."],
["bb","The Bombay phenotype lacks which antigen?","H antigen","D antigen","Kell antigen","Duffy antigen","With no H, A and B can't be built. These people make anti-H and need Bombay blood."],
["bb","Acute hemolytic transfusion reactions are most often caused by:","ABO incompatibility, usually from identification errors","Anti-Kell","Platelet antibodies","Bacterial contamination","Patient and specimen identification is the main safeguard."],
["ua","A positive urine nitrite most suggests:","Gram-negative bacteria that reduce nitrate (e.g. E. coli)","Kidney stones","Glomerular bleeding","Yeast infection","A negative nitrite doesn't rule out a UTI. Some organisms don't reduce nitrate, and short bladder time limits conversion."],
["ua","Red blood cell casts in urine indicate:","Glomerular disease (glomerulonephritis)","Lower urinary tract bleeding","Pyelonephritis","Normal finding after exercise","RBCs entering the tubules at the glomerulus get trapped in the casts."],
["ua","White blood cell casts most suggest:","Pyelonephritis","Cystitis only","Nephrotic syndrome","Prerenal azotemia","They point to inflammation or infection inside the kidney itself."],
["ua","Envelope-shaped (square with an X) crystals are:","Calcium oxalate dihydrate","Uric acid","Triple phosphate","Cystine",""],
["ua","'Coffin-lid' crystals in alkaline urine are:","Triple phosphate (struvite)","Calcium oxalate","Cystine","Amorphous urates","They're associated with urease-producing bacteria such as Proteus."],
["ua","Colorless hexagonal plates in acidic urine suggest:","Cystine","Uric acid","Cholesterol","Calcium phosphate","Cystine crystals are abnormal and point to cystinuria."],
["qc","Under Westgard rules, a single control outside ±3 SD violates which rule?","1-3s (reject the run)","1-2s (warning)","2-2s","R-4s",""],
["qc","Coefficient of variation (CV) is calculated as:","(SD ÷ mean) × 100","(mean ÷ SD) × 100","SD × mean","(range ÷ mean) × 100","CV expresses imprecision as a percent of the mean."],
["qc","A delta check compares a result with:","The same patient's previous result","The reference interval","The control mean","Another patient's result","A big unexplained change can flag a mislabeled or contaminated specimen."],
["qc","A Levey-Jennings chart plots:","Control values over time against mean and SD limits","Patient results by age","Calibration curves","Turnaround time by shift",""],
];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={mode:"duo",names:["Player 1","Player 2"],cats:Object.keys(CATS),per:6,timer:true};
try{Object.assign(S,JSON.parse(localStorage.getItem("br-setup")||"{}"))}catch(e){}
let G=null,tick=null;
function setup(){
  $("scores").hidden=true;$("tag").textContent=`${Q.length} questions · 7 benches`;
  $("view").innerHTML=`<div class="card"><div class="cap" style="background:linear-gradient(90deg,var(--lav),var(--blue),var(--gold),var(--green),var(--pink),var(--yellow),var(--gray))"></div><div class="label">
   <p class="q" style="font-size:17px;font-weight:400">Multiple-choice lab trivia. In two-player mode you take turns on the same phone and each get your own questions.</p>
   <div class="seg" role="group" aria-label="Mode"><button id="m1" aria-pressed="${S.mode==='solo'}">Solo</button><button id="m2" aria-pressed="${S.mode==='duo'}">Two players</button></div>
   <div class="row" id="namesRow" ${S.mode==='solo'?'hidden':''}><label class="field"><span>Player 1</span><input id="n1" maxlength="14" value="${esc(S.names[0])}"></label><label class="field"><span>Player 2</span><input id="n2" maxlength="14" value="${esc(S.names[1])}"></label></div>
   <div><div class="tag" style="margin-bottom:6px">Benches</div><div class="cats">${Object.entries(CATS).map(([k,v])=>`<label><input type="checkbox" value="${k}" ${S.cats.includes(k)?"checked":""}><span class="dot" style="background:${v.c}"></span>${v.name}</label>`).join("")}</div></div>
   <div class="row"><label class="field"><span>Questions each</span><input id="per" type="number" min="3" max="20" value="${S.per}"></label>
     <label class="field" style="flex-direction:row;display:flex;align-items:center;gap:8px;padding-top:16px"><input id="tm" type="checkbox" ${S.timer?"checked":""} style="width:auto"> 20-second clock</label></div>
   <button class="btn" id="go">Start round</button></div></div>`;
  $("m1").onclick=()=>{S.mode="solo";setup()};$("m2").onclick=()=>{S.mode="duo";setup()};
  $("go").onclick=()=>{
    S.names=[($("n1")?.value||S.names[0]).trim()||"Player 1",($("n2")?.value||S.names[1]).trim()||"Player 2"];
    S.cats=[...document.querySelectorAll(".cats input:checked")].map(i=>i.value);if(!S.cats.length)S.cats=Object.keys(CATS);
    S.per=Math.max(3,Math.min(20,+$("per").value||6));S.timer=$("tm").checked;
    try{localStorage.setItem("br-setup",JSON.stringify(S))}catch(e){}start()};
}
function start(){
  const players=S.mode==="solo"?1:2;const pool=shuffle(Q.filter(q=>S.cats.includes(q[0])));
  const need=S.per*players;const deck=[];while(deck.length<need)deck.push(...shuffle(pool));
  G={players,deck:deck.slice(0,need),i:0,score:Array(players).fill(0),right:Array(players).fill(0),streak:Array(players).fill(0)};
  $("scores").hidden=false;handoff();
}
const cur=()=>G.i%G.players;
function renderScores(){$("scores").style.gridTemplateColumns=G.players===1?"1fr":"1fr 1fr";
  $("scores").innerHTML=G.score.map((s,p)=>`<div class="score ${p===cur()&&G.i<G.deck.length?"on":""}"><span class="n">${esc(G.players===1?"Score":S.names[p])}</span><span class="v">${s}</span></div>`).join("")}
function handoff(){
  renderScores();
  if(G.i>=G.deck.length)return final();
  if(G.players===2){$("view").innerHTML=`<div class="card"><div class="cap" style="background:var(--accent)"></div><div class="label" style="text-align:center">
    <div class="tag">Question ${Math.floor(G.i/2)+1} of ${S.per}</div><p class="big">${esc(S.names[cur()])}, you're up</p><p class="muted">Pass the phone over, then tap when ready.</p><button class="btn" id="rdy">Show my question</button></div></div>`;
    $("rdy").onclick=ask;$("rdy").focus()} else ask();
}
function ask(){
  const q=G.deck[G.i],cat=CATS[q[0]];const opts=shuffle([0,1,2,3]);
  $("tag").textContent=G.players===2?`Round ${Math.floor(G.i/2)+1}/${S.per}`:`Question ${G.i+1}/${S.per}`;
  $("view").innerHTML=`<div class="card"><div class="cap" style="background:${cat.c}"></div><div class="label">
   <div class="meta"><span class="chip"><span class="dot" style="background:${cat.c}"></span>${cat.name}</span><span>${G.players===2?esc(S.names[cur()])+" · ":""}streak ${G.streak[cur()]}</span></div>
   ${S.timer?'<div class="bar"><i id="tb" style="width:100%"></i></div>':""}
   <p class="q">${esc(q[1])}</p>
   <div class="opts">${opts.map((o,k)=>`<button class="opt" data-o="${o}"><b>${"ABCD"[k]}</b><span>${esc(q[2+o])}</span></button>`).join("")}</div>
   <div id="after"></div></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  clearInterval(tick);if(S.timer){const t0=performance.now();tick=setInterval(()=>{const left=1-(performance.now()-t0)/20000;const tb=$("tb");if(tb)tb.style.width=Math.max(0,left*100)+"%";if(left<=0)answer(-1)},100)}
}
function answer(o){
  clearInterval(tick);const q=G.deck[G.i],p=cur();const ok=o===0;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.o;if(v===0)b.classList.add("right");else if(v===o)b.classList.add("wrong")});
  if(ok){G.streak[p]++;const pts=10+Math.min(G.streak[p]-1,5)*2;G.score[p]+=pts;G.right[p]++}else G.streak[p]=0;
  renderScores();
  $("after").innerHTML=`<div class="why"><strong style="color:${ok?"var(--good)":"var(--bad)"}">${ok?"Correct":o===-1?"Time's up":"Not quite"}</strong>${q[6]?esc(q[6]):"Answer: "+esc(q[2])}</div>
    <div style="margin-top:12px"><button class="btn" id="nx">${G.i+1>=G.deck.length?"See results":G.players===2?"Next player":"Next question"}</button></div>`;
  $("nx").onclick=()=>{G.i++;handoff()};$("nx").focus();
}
function final(){
  $("tag").textContent="Round complete";
  let head;if(G.players===1)head=`${G.right[0]} of ${S.per} correct`;else head=G.score[0]===G.score[1]?"It's a tie":`${esc(S.names[G.score[0]>G.score[1]?0:1])} wins`;
  $("view").innerHTML=`<div class="card"><div class="cap" style="background:var(--accent)"></div><div class="label" style="text-align:center">
   <p class="big">${head}</p>${G.score.map((s,p)=>`<p class="muted">${esc(G.players===1?"Score":S.names[p])}: <b style="color:var(--ink)">${s}</b> pts · ${G.right[p]}/${S.per} right</p>`).join("")}
   <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="set">Change setup</button></div></div></div>`;
  $("again").onclick=start;$("set").onclick=setup;
}
setup();
})();
</script>
