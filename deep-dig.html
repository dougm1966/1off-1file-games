<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Deep Dig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<style>
/* Layout: one-screen arcade cabinet: title/score strip, fitted playfield canvas, one-line controls hint */
:root{--bg:#170f0a;--ink:#fff3df;--muted:#c9a98a;--accent:#ffb92e;--f-display:"Luckiest Guy","Arial Black",sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:6px}
.app{height:100%;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.hud .title{font-family:var(--f-display);font-size:19px;color:var(--accent);white-space:nowrap}
.hud .stats{display:flex;gap:10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:flex-end}
.hud .stats b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
canvas{display:block;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.help{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:color-mix(in srgb,var(--bg) 92%,transparent);border:2px solid var(--accent);border-radius:16px;padding:20px;text-align:center;display:grid;gap:10px;max-width:310px;margin:0 16px}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--accent);line-height:1.1}
.card p{margin:0;line-height:1.4} .card .sub{color:var(--muted);font-size:14px}
.card button,.btn{height:48px;border:0;border-radius:12px;background:var(--accent);color:#111;font-family:var(--f-display);font-size:19px;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pump{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:8px;width:84px;height:84px;border-radius:50%;border:3px solid #fff3df;background:#e8452c;color:#fff3df;font-family:var(--f-display);font-size:20px;box-shadow:0 6px 16px rgba(0,0,0,.5);touch-action:manipulation;z-index:2}.pump:active{transform:scale(.94)}
</style>
<div class="app">
  <div class="hud"><div class="title">Deep Dig</div><div class="stats" id="stats"></div></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="over" id="over" hidden><div class="card" id="card"></div></div></div>
  <div class="help">Hold and slide to dig · PUMP inflates monsters</div>
</div>
<script>
(()=>{
const LW=364,LH=442,FONT="'Luckiest Guy', sans-serif";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");let SC=1;
function fit(){SC=Math.min(stage.clientWidth/LW,stage.clientHeight/LH);const d=Math.min(2,devicePixelRatio||1);
  cv.style.width=LW*SC+"px";cv.style.height=LH*SC+"px";cv.width=Math.round(LW*SC*d);cv.height=Math.round(LH*SC*d);ctx.setTransform(SC*d,0,0,SC*d,0,0)}
addEventListener("resize",fit);
function stats(o){document.getElementById("stats").innerHTML=Object.entries(o).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}
function card(html,btn,cb){const o=document.getElementById("over");document.getElementById("card").innerHTML=html+`<button id="go">${btn}</button>`;o.hidden=false;
  document.getElementById("go").onclick=()=>{o.hidden=true;cb()}}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function loop(step){let last=performance.now();function f(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;step(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}
const getBest=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}},setBest=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
// Pointer on the whole stage (so drags below/beside the canvas still count). Handlers get local canvas coords.
function pointer(h){let p=null;
  stage.addEventListener("pointerdown",e=>{if(e.target.closest(".card,button"))return;e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){}const l=toLocal(e);p={id:e.pointerId,x0:l.x,y0:l.y,lx:l.x,ly:l.y,t:performance.now()};h.down&&h.down(l,p)});
  stage.addEventListener("pointermove",e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.move&&h.move(l,l.x-p.lx,l.y-p.ly,p);p.lx=l.x;p.ly=l.y});
  const up=e=>{if(!p||p.id!==e.pointerId)return;const l=toLocal(e);h.up&&h.up(l,p,performance.now()-p.t);p=null};
  stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);return ()=>p}
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key.startsWith("Arrow")||e.key===" ")e.preventDefault()});addEventListener("keyup",e=>{keys[e.key]=0});
const parts=[];
function burst(x,y,col,n=12,sp=120,life=.6){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,col})}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function drawParts(){for(const q of parts){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.col;ctx.fillRect(q.x-1.5,q.y-1.5,3,3)}ctx.globalAlpha=1}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(t,x,y,size,col,align="center"){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,.6)";ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}


const T=26,GW=14,GH=17,SKY=2,DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},OPP={u:"d",d:"u",l:"r",r:"l"};
const LAYER=["#d9a35b","#c4793a","#a5512c","#7a3420"],LPTS=[200,300,400,500];
let dug,rocks,foes,hero,hose,score,lives,level,state="menu",best=getBest("dd-best"),hold=null,banner="",bannerT=0;
const pumpBtn=document.createElement("button");pumpBtn.className="pump";pumpBtn.textContent="PUMP";pumpBtn.setAttribute("aria-label","Pump");stage.appendChild(pumpBtn);
const isDug=(x,y)=>y<SKY||(x>=0&&x<GW&&y<GH&&dug[y][x]);const inside=(x,y)=>x>=0&&x<GW&&y>=0&&y<GH;
const layerOf=y=>Math.min(3,Math.floor((y-SKY)/((GH-SKY)/4)));
function makeLevel(){dug=Array.from({length:GH},()=>Array(GW).fill(false));
  for(let y=SKY;y<=8;y++)dug[y][7]=true;
  const pockets=[[2,5,"h"],[10,6,"v"],[3,12,"h"],[9,13,"h"],[11,10,"v"],[1,9,"v"]].slice(0,Math.min(6,3+level));
  foes=pockets.map(([x,y,o],i)=>{for(let k=-1;k<=1;k++){if(o==="h")dug[y][clamp(x+k,0,GW-1)]=true;else dug[clamp(y+k,SKY,GH-1)][x]=true}return {x,y,dir:o==="h"?"r":"d",p:0,kind:i%3===2?1:0,inf:0,ghost:false,ghostT:rnd(5,10),tx:x,ty:y,stuck:0}});
  rocks=[[4,4],[11,3],[6,11],[12,14],[2,15]].slice(0,3+Math.min(2,level-1)).map(([x,y])=>({x,y,fy:y,state:"rest",t:0}));
  hero={x:7,y:1,dir:"d",p:0,face:"d",moving:false};hose=null;banner=`Level ${level}`;bannerT=1.3}
function newGame(){score=0;lives=3;level=1;makeLevel();state="play";hud()}
function hud(){stats({Score:score,Best:Math.max(best,score),Lvl:level||1,"♥":lives??3})}
pointer({down:(l,p)=>{hold={x0:l.x,y0:l.y,dir:null}},move:l=>{if(!hold)return;const ax=l.x-hold.x0,ay=l.y-hold.y0;if(Math.hypot(ax,ay)>12){hold.dir=Math.abs(ax)>Math.abs(ay)?(ax>0?"r":"l"):(ay>0?"d":"u");if(Math.hypot(ax,ay)>40){hold.x0=l.x-ax*.5;hold.y0=l.y-ay*.5}}},up:()=>{hold=null}});
pumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();pump()});addEventListener("keydown",e=>{if(e.key===" ")pump()});
function want(){if(keys.ArrowUp)return"u";if(keys.ArrowDown)return"d";if(keys.ArrowLeft)return"l";if(keys.ArrowRight)return"r";return hold&&hold.dir}
const rockAt=(x,y)=>rocks.some(r=>r.state!=="gone"&&r.x===x&&Math.round(r.fy)===y);
function pump(){if(state!=="play"||bannerT>0)return;
  if(hose&&hose.foe){hose.foe.inf++;hose.foe.deflate=0;if(hose.foe.inf>=4){const f=hose.foe,pts=LPTS[layerOf(f.y)]||200;score+=pts;floaty.push({x:f.x*T+13,y:f.y*T+13,t:1,s:pts});burst(f.x*T+13,f.y*T+13,f.kind?"#ff8a3d":"#c86bff",26,180);foes=foes.filter(o=>o!==f);hose=null;hud()}else hose.t=.35;return}
  const [dx,dy]=DIRS[hero.face];let len=0,hit=null;for(let i=1;i<=3;i++){const x=hero.x+dx*i,y=hero.y+dy*i;if(!inside(x,y)||!isDug(x,y))break;len=i;hit=foes.find(f=>!f.ghost&&Math.round(f.x+(DIRS[f.dir][0]*f.p))===x&&Math.round(f.y+(DIRS[f.dir][1]*f.p))===y);if(hit)break}
  hose={len:hit?len:Math.max(len,0.6),foe:hit||null,t:.35};if(hit){hit.inf=1;hit.deflate=0;hit.p=0}}
function step(e,sp,dt,choose){e.p+=sp*dt;if(e.p>=1){e.p=0;e.x+=DIRS[e.dir][0];e.y+=DIRS[e.dir][1];choose&&choose(e)}}
function update(dt){if(state!=="play")return;if(bannerT>0){bannerT-=dt;return}
  // hero
  if(hose){hose.t-=dt;if(!hose.foe&&hose.t<=0)hose=null;else if(hose&&hose.foe&&!foes.includes(hose.foe))hose=null}
  const w=want();if(hose&&hose.foe&&w&&hose.t<=0)hose=null; // walking away drops the hose
  if(!hose||!hose.foe){if(hose&&!hose.foe&&w)hose=null;
    if(hero.p===0){if(w){const nx=hero.x+DIRS[w][0],ny=hero.y+DIRS[w][1];hero.face=w;if(inside(nx,ny)&&ny>=1&&!rockAt(nx,ny)){hero.dir=w;hero.moving=true}else hero.moving=false}else hero.moving=false}
    else if(w===OPP[hero.dir]){hero.x+=DIRS[hero.dir][0];hero.y+=DIRS[hero.dir][1];hero.p=1-hero.p;hero.dir=w;hero.face=w}
    if(hero.moving||hero.p>0){const nx=hero.x+DIRS[hero.dir][0],ny=hero.y+DIRS[hero.dir][1];const digging=!isDug(nx,ny);step(hero,digging?3.2:4.6,dt,h=>{if(h.y>=SKY)dug[h.y][h.x]=true});
      if(hero.p>0.5&&inside(nx,ny)&&ny>=SKY&&!dug[ny][nx]){dug[ny][nx]=true;if(Math.random()<.4)burst(nx*T+13,ny*T+13,LAYER[layerOf(ny)],3,40,.3)}}}
  // rocks
  for(const r of rocks){if(r.state==="rest"&&isDug(r.x,r.y+1)&&!(hero.x===r.x&&hero.y===r.y+1&&hero.p===0&&hero.dir==="u")){r.state="wobble";r.t=.7}
    else if(r.state==="wobble"){r.t-=dt;if(r.t<=0){r.state="fall";r.vy=0;r.kills=0}}
    else if(r.state==="fall"){r.vy=Math.min(r.vy+20*dt,9);r.fy+=r.vy*dt;const ty=Math.floor(r.fy)+1;
      for(const f of foes)if(Math.abs((f.x+DIRS[f.dir][0]*f.p)-r.x)<.6&&Math.abs((f.y+DIRS[f.dir][1]*f.p)-r.fy)<.8){f.dead=true;r.kills++;burst(f.x*T+13,f.y*T+13,"#fff",14,120)}
      if(foes.some(f=>f.dead)){foes=foes.filter(f=>!f.dead)}
      if(Math.abs(hero.x+DIRS[hero.dir][0]*hero.p-r.x)<.6&&Math.abs(hero.y+DIRS[hero.dir][1]*hero.p-r.fy)<.8){die();return}
      if(ty>=GH||!isDug(r.x,ty)){r.fy=ty-1;r.state="gone";r.t=.6;if(r.kills){const p=[0,1000,2500,4000][Math.min(3,r.kills)]||4000;score+=p;floaty.push({x:r.x*T+13,y:r.fy*T,t:1.2,s:p});hud()}burst(r.x*T+13,r.fy*T+20,"#8a7f74",14,90)}}
    else if(r.state==="gone")r.t-=dt}
  // foes
  for(const f of foes){
    if(f.inf>0){f.deflate=(f.deflate||0)+dt;if(f.deflate>1){f.deflate=0;f.inf--;if(f.inf<=0&&hose&&hose.foe===f)hose=null}continue}
    if(f.ghost){const tx=hero.x,ty=hero.y,dx=tx-f.gx,dy=ty-f.gy,d=Math.hypot(dx,dy)||1;f.gx+=dx/d*1.6*dt;f.gy+=dy/d*1.6*dt;
      const rx=Math.round(f.gx),ry=Math.round(f.gy);if(Math.hypot(f.gx-rx,f.gy-ry)<.08&&isDug(rx,ry)&&ry>=SKY&&f.ghostLeft<=0){f.ghost=false;f.x=rx;f.y=ry;f.p=0;f.ghostT=rnd(6,12)}f.ghostLeft-=dt;continue}
    f.ghostT-=dt;if(f.ghostT<=0&&f.p===0&&state==="play"){f.ghost=true;f.gx=f.x;f.gy=f.y;f.ghostLeft=1.2;continue}
    if(f.p===0)chooseFoe(f);
    if(f.canMove)step(f,(f.kind?2.6:2.2)+level*.15,dt,chooseFoe)}
  // collisions
  const hx=hero.x+DIRS[hero.dir][0]*hero.p,hy=hero.y+DIRS[hero.dir][1]*hero.p;
  for(const f of foes){if(f.inf>0)continue;const fx=f.ghost?f.gx:f.x+DIRS[f.dir][0]*f.p,fy=f.ghost?f.gy:f.y+DIRS[f.dir][1]*f.p;if(Math.hypot(fx-hx,fy-hy)<.7){die();return}}
  rocks=rocks.filter(r=>!(r.state==="gone"&&r.t<=0));
  if(!foes.length){level++;score+=1000;hud();makeLevel()}
}
function chooseFoe(f){const opts=Object.keys(DIRS).filter(d=>{const nx=f.x+DIRS[d][0],ny=f.y+DIRS[d][1];return inside(nx,ny)&&ny>=SKY&&isDug(nx,ny)&&!rockAt(nx,ny)});
  if(!opts.length){f.canMove=false;return}f.canMove=true;let choices=opts.length>1?opts.filter(d=>d!==OPP[f.dir]):opts;
  if(Math.random()<.65){let bd=1e9;for(const d of choices){const dd=Math.hypot(f.x+DIRS[d][0]-hero.x,f.y+DIRS[d][1]-hero.y);if(dd<bd){bd=dd;f.dir=d}}}else f.dir=pick(choices)}
function die(){lives--;hud();burst(hero.x*T+13,hero.y*T+13,"#fff3df",30,180,1);hose=null;
  if(lives<=0){state="over";if(score>best){best=score;setBest("dd-best",best)}setTimeout(()=>card(`<h1>Cave-in!</h1><p>Score ${score} · level ${level}</p><p class="sub">Best ${best}</p>`,"Dig again",newGame),900);return}
  hero={x:7,y:1,dir:"d",p:0,face:"d"};for(const f of foes){f.ghost=false;f.inf=0}banner="Ready";bannerT=1.2}
const floaty=[];
function draw(){const sky=ctx.createLinearGradient(0,0,0,SKY*T);sky.addColorStop(0,"#5ec6f2");sky.addColorStop(1,"#bfe9ff");ctx.fillStyle=sky;ctx.fillRect(0,0,LW,SKY*T);
  for(let y=SKY;y<GH;y++){ctx.fillStyle=LAYER[layerOf(y)];ctx.fillRect(0,y*T,LW,T)}
  ctx.fillStyle="rgba(0,0,0,.12)";for(let i=0;i<160;i++){const x=(i*53)%LW,y=SKY*T+(i*97)%((GH-SKY)*T);ctx.fillRect(x,y,3,2)}
  ctx.fillStyle="#3d8c3a";ctx.fillRect(0,SKY*T-4,LW,5);
  if(dug){ctx.fillStyle="#1e130c";for(let y=SKY;y<GH;y++)for(let x=0;x<GW;x++)if(dug[y][x]){rr(x*T+3,y*T+3,T-6,T-6,8);ctx.fill();
      if(x+1<GW&&dug[y][x+1])ctx.fillRect(x*T+T/2,y*T+3,T,T-6);if(y+1<GH&&dug[y+1][x])ctx.fillRect(x*T+3,y*T+T/2,T-6,T);if(y===SKY)ctx.fillRect(x*T+3,y*T-2,T-6,T/2)}}
  if(rocks)for(const r of rocks){if(r.state==="gone"&&Math.floor(r.t*10)%2)continue;const wob=r.state==="wobble"?Math.sin(performance.now()/30)*2:0,x=r.x*T+13+wob,y=r.fy*T+13;
    ctx.fillStyle="#8a7f74";ctx.beginPath();ctx.moveTo(x-11,y+10);ctx.lineTo(x-12,y-2);ctx.lineTo(x-5,y-11);ctx.lineTo(x+7,y-10);ctx.lineTo(x+12,y);ctx.lineTo(x+10,y+10);ctx.closePath();ctx.fill();ctx.fillStyle="#b3a89c";ctx.beginPath();ctx.moveTo(x-5,y-11);ctx.lineTo(x+7,y-10);ctx.lineTo(x+2,y-3);ctx.closePath();ctx.fill()}
  if(foes)for(const f of foes){const x=(f.ghost?f.gx:f.x+DIRS[f.dir][0]*f.p)*T+13,y=(f.ghost?f.gy:f.y+DIRS[f.dir][1]*f.p)*T+13;
    if(f.ghost){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x-4,y,3.5,0,7);ctx.arc(x+4,y,3.5,0,7);ctx.fill();ctx.fillStyle="#111";ctx.fillRect(x-5,y-1,2,2);ctx.fillRect(x+3,y-1,2,2);continue}
    const s=1+f.inf*.28;ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    if(f.kind){ctx.fillStyle="#ff8a3d";ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=i%2?8:11;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.fill()}
    else{ctx.fillStyle="#b65cf0";ctx.beginPath();ctx.arc(0,-1,10,Math.PI,0);ctx.lineTo(10,8);for(let i=0;i<4;i++)ctx.quadraticCurveTo(7-i*5,4,5-i*5,8);ctx.closePath();ctx.fill()}
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,-2,5,0,7);ctx.fill();ctx.fillStyle="#1e130c";const [ex,ey]=DIRS[f.dir];ctx.beginPath();ctx.arc(ex*2,-2+ey*2,2.5,0,7);ctx.fill();ctx.restore()}
  if(hero&&state!=="menu"){const x=(hero.x+DIRS[hero.dir][0]*hero.p)*T+13,y=(hero.y+DIRS[hero.dir][1]*hero.p)*T+13;
    if(hose){const [dx,dy]=DIRS[hero.face];ctx.strokeStyle="#f2f2f2";ctx.lineWidth=3;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*hose.len*T,y+dy*hose.len*T);ctx.stroke();ctx.setLineDash([])}
    const flip=hero.face==="l"?-1:1;ctx.save();ctx.translate(x,y);ctx.scale(flip,1);
    ctx.fillStyle="#2d6fd6";rr(-7,-2,14,12,3);ctx.fill();ctx.fillStyle="#ffd9b0";ctx.beginPath();ctx.arc(0,-6,6,0,7);ctx.fill();
    ctx.fillStyle="#ffb92e";ctx.beginPath();ctx.arc(0,-8,7,Math.PI,0);ctx.fill();ctx.fillRect(-7,-9,16,2);ctx.fillStyle="#fffbe0";ctx.beginPath();ctx.arc(3,-11,2,0,7);ctx.fill();
    ctx.fillStyle="#1e130c";ctx.fillRect(2,-6,2,2);ctx.fillStyle="#8a8f99";ctx.fillRect(5,1,8,3);ctx.restore()}
  for(let i=floaty.length-1;i>=0;i--){const f=floaty[i];f.t-=1/60;text(String(f.s),f.x,f.y-(1.2-f.t)*16,14,"#fff3df");if(f.t<=0)floaty.splice(i,1)}
  drawParts();if(bannerT>0&&state==="play")text(banner,LW/2,LH/2,28,"#ffb92e")}
